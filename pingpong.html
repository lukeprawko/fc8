<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CYBERPONG</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060c;
    --panel: rgba(12, 17, 29, 0.85);
    --card: rgba(20, 28, 46, 0.75);
    --p1: #00f0ff;
    --p2: #ff0055;
    --spin: #b845ff;
    --gold: #f5b041;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-drag: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg);
    color: #f0f6fc;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    inset: 0;
  }

  /* TŁO Z SYMULACJĄ MECZU */
  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
  }

  .app-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  /* LOGO W MENU */
  .logo-wrap {
    text-align: center;
    margin-bottom: 18px;
  }
  .logo-wrap h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(32px, 4.5vw, 52px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(90deg, var(--p1), #ffffff, var(--p2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.4));
  }

  /* NOWOCZESNE MENU BEZ ZBĘDNEGO TEKSTU */
  #menu {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hub-panel {
    background: var(--panel);
    backdrop-filter: blur(22px);
    border: 1px solid rgba(0, 240, 255, 0.22);
    border-radius: 24px;
    padding: 26px;
    width: 720px;
    max-width: 94vw;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 240, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* GÓRNY PASEK: NICK + WYBÓR STEROWANIA */
  .top-row {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 16px;
    align-items: stretch;
  }

  .nick-box {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nick-box svg {
    width: 28px;
    height: 28px;
    fill: var(--p1);
    flex-shrink: 0;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
  }
  .nick-box input {
    width: 100%;
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    outline: none;
  }

  .ctrl-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .ctrl-tile {
    background: var(--card);
    border: 2px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.2s ease;
  }
  .ctrl-tile svg {
    width: 28px;
    height: 28px;
    fill: #8b949e;
    transition: all 0.2s ease;
    pointer-events: none;
  }
  .ctrl-tile span {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #8b949e;
    pointer-events: none;
  }
  .ctrl-tile:hover {
    border-color: rgba(0, 240, 255, 0.4);
  }
  .ctrl-tile.active {
    border-color: var(--p1);
    background: rgba(0, 240, 255, 0.12);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.22);
  }
  .ctrl-tile.active svg {
    fill: var(--p1);
    filter: drop-shadow(0 0 8px var(--p1));
  }
  .ctrl-tile.active span { color: #fff; }

  /* ŚRODKOWY PASEK: KARTY TRYBÓW GRY */
  .modes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .mode-card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }

  .mode-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mode-icon.ai-ic {
    background: rgba(184, 69, 255, 0.15);
    border: 1px solid rgba(184, 69, 255, 0.4);
  }
  .mode-icon.p2p-ic {
    background: rgba(0, 240, 255, 0.15);
    border: 1px solid rgba(0, 240, 255, 0.4);
  }
  .mode-icon svg { width: 24px; height: 24px; }

  .mode-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #fff;
  }

  /* POZIOMY BOTA (3 PRZYCISKI) */
  .ai-tiers {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .tier-btn {
    background: rgba(6, 9, 16, 0.8);
    border: 1px solid #263147;
    border-radius: 10px;
    padding: 8px 4px;
    color: #8b949e;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tier-btn.active {
    border-color: var(--spin);
    color: #fff;
    background: rgba(184, 69, 255, 0.25);
    box-shadow: 0 0 12px rgba(184, 69, 255, 0.35);
  }

  /* PRZYCISKI AKCJI */
  .action-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    color: #fff;
  }
  .action-btn:active { transform: scale(0.97); }

  .btn-play-ai {
    background: linear-gradient(135deg, #7000ff, #c800ff);
    box-shadow: 0 6px 20px rgba(184, 0, 255, 0.35);
  }
  .btn-play-ai:hover { filter: brightness(1.15); box-shadow: 0 0 25px rgba(200, 0, 255, 0.6); }

  .btn-host {
    background: linear-gradient(135deg, #00b4db, #0077b6);
    box-shadow: 0 6px 20px rgba(0, 180, 219, 0.3);
  }
  .btn-host:hover { filter: brightness(1.15); box-shadow: 0 0 25px rgba(0, 240, 255, 0.55); }

  .join-row {
    display: flex;
    gap: 8px;
  }
  .join-row input {
    width: 52%;
    background: rgba(5, 7, 12, 0.9);
    border: 1px solid #28334a;
    border-radius: 12px;
    padding: 0 12px;
    color: var(--p1);
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    outline: none;
  }
  .join-row input:focus { border-color: var(--p2); }
  .btn-join {
    width: 48%;
    background: linear-gradient(135deg, #ff0055, #b8003d);
    box-shadow: 0 6px 20px rgba(255, 0, 85, 0.3);
  }
  .btn-join:hover { filter: brightness(1.15); box-shadow: 0 0 25px rgba(255, 0, 85, 0.55); }

  /* PANEL OCZEKIWANIA */
  .wait-panel {
    background: var(--panel);
    backdrop-filter: blur(22px);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 24px;
    padding: 32px;
    width: 400px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
  }
  #roomCodeDisplay {
    font-family: 'Orbitron', sans-serif;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 8px;
    color: var(--p1);
    margin: 18px 0;
    background: #05070b;
    padding: 16px;
    border-radius: 14px;
    border: 1px dashed var(--p1);
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
  }

  #statusMsg {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    min-height: 18px;
    letter-spacing: 1px;
  }

  /* OBSZAR GRY - DOPASOWANY DO 100% EKRANU BEZ PRZEWIJANIA */
  #gameWrapper {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: min(94vw, calc((100vh - 135px) * 1.8));
    max-width: 1260px;
  }

  #hud {
    width: 100%;
    background: var(--panel);
    border: 1px solid #283044;
    border-bottom: none;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    padding: 8px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .player-box {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 220px;
  }
  .player-box.right { align-items: flex-end; }

  .team-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 900;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .p1-color { color: var(--p1); text-shadow: 0 0 12px rgba(0, 240, 255, 0.5); }
  .p2-color { color: var(--p2); text-shadow: 0 0 12px rgba(255, 0, 85, 0.5); }

  .stamina-bar-wrap {
    width: 150px;
    height: 6px;
    background: #080b12;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
    border: 1px solid #283044;
  }
  .stamina-fill {
    height: 100%;
    width: 100%;
    transition: width 0.08s linear;
  }

  #hudScore {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    background: #05070b;
    padding: 4px 24px;
    border-radius: 10px;
    border: 1px solid #283044;
    letter-spacing: 4px;
  }

  /* PASEK ULEPSZEŃ */
  #upgradesPanel {
    width: 100%;
    background: #090d16;
    border: 1px solid #283044;
    border-bottom: none;
    padding: 6px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .up-badge {
    background: rgba(245, 176, 65, 0.14);
    border: 1px solid var(--gold);
    padding: 4px 10px;
    border-radius: 8px;
    font-weight: 800;
    color: var(--gold);
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #111726;
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid #1f293d;
    font-size: 13px;
    font-weight: 700;
  }
  .stat-dots { display: flex; gap: 3px; }
  .dot {
    width: 7px;
    height: 11px;
    background: #21262d;
    border-radius: 2px;
  }
  .dot.active {
    background: var(--p1);
    box-shadow: 0 0 6px var(--p1);
  }
  .stat-btn {
    padding: 3px 8px;
    border: none;
    border-radius: 5px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 800;
    background: #238636;
    color: #fff;
    cursor: pointer;
  }
  .stat-btn:hover:not(:disabled) { background: #2ea44f; }
  .stat-btn:disabled { background: #1a2029; color: #484f58; cursor: not-allowed; }

  .util-btns { display: flex; gap: 6px; }
  .icon-btn {
    padding: 5px 10px;
    border-radius: 7px;
    background: #161e2e;
    border: 1px solid #2b3854;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: #c9d1d9;
    cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--p1); color: #fff; }

  /* PŁÓTNO GRY */
  .canvas-container {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 5;
  }
  canvas#stage {
    background: #060911;
    border: 1px solid #283044;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    box-shadow: 0 20px 55px rgba(0,0,0,0.9);
    display: block;
    width: 100%;
    height: 100%;
  }

  /* MODAL KOŃCA MECZU */
  #victoryModal {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(5, 7, 12, 0.9);
    backdrop-filter: blur(10px);
    z-index: 90;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
  }
  #victoryModal h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 40px;
    margin-bottom: 8px;
  }
  #victoryModal p {
    font-size: 18px;
    color: #8b949e;
    margin-bottom: 22px;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    width: 320px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="app-layer">

  <!-- MENU GŁÓWNE -->
  <div id="menu">
    <div class="logo-wrap">
      <h1>CYBERPONG</h1>
    </div>

    <div class="hub-panel" id="mainPanel">
      <!-- PROFIL I WYBÓR STEROWANIA -->
      <div class="top-row">
        <div class="nick-box" title="Twój Nick">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
          <input id="nickInput" maxlength="12" placeholder="NICK..." value="CYBER">
        </div>

        <div class="ctrl-selector">
          <div class="ctrl-tile active" id="ctrlKeyboard" onclick="selectControl('keyboard')">
            <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
            <span>KLAWIATURA</span>
          </div>
          <div class="ctrl-tile" id="ctrlMouse" onclick="selectControl('mouse')">
            <svg viewBox="0 0 24 24"><path d="M13 1.07V9h7c0-4.08-3.05-7.44-7-7.93zM4 15c0 4.42 3.58 8 8 8s8-3.58 8-8v-4H4v4zm7-13.93C7.05 1.56 4 4.92 4 9h7V1.07z"/></svg>
            <span>MYSZKA</span>
          </div>
        </div>
      </div>

      <!-- KARTY TRYBÓW GRY -->
      <div class="modes-grid">
        <!-- SOLO VS AI -->
        <div class="mode-card">
          <div class="mode-header">
            <div class="mode-icon ai-ic">
              <svg viewBox="0 0 24 24" fill="#b845ff"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM9 13c-.83 0-1.5-.67-1.5-1.5S8.17 10 9 10s1.5.67 1.5 1.5S9.83 13 9 13zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z"/></svg>
            </div>
            <div class="mode-title">SOLO ARENA</div>
          </div>

          <div class="ai-tiers">
            <button type="button" class="tier-btn" id="ai-easy" onclick="setAiTier('easy')">ŁATWY</button>
            <button type="button" class="tier-btn active" id="ai-medium" onclick="setAiTier('medium')">ŚREDNI</button>
            <button type="button" class="tier-btn" id="ai-hard" onclick="setAiTier('hard')">PRO</button>
          </div>

          <button type="button" class="action-btn btn-play-ai" onclick="startSingleplayer()">START VS AI</button>
        </div>

        <!-- ONLINE P2P -->
        <div class="mode-card">
          <div class="mode-header">
            <div class="mode-icon p2p-ic">
              <svg viewBox="0 0 24 24" fill="#00f0ff"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </div>
            <div class="mode-title">MULTIPLAYER</div>
          </div>

          <button type="button" class="action-btn btn-host" onclick="createRoom()">STWÓRZ POKÓJ</button>

          <div class="join-row">
            <input id="joinInput" maxlength="6" placeholder="KOD">
            <button type="button" class="action-btn btn-join" onclick="joinRoom()">DOŁĄCZ</button>
          </div>
        </div>
      </div>

      <div id="statusMsg"></div>
    </div>

    <!-- EKRAN OCZEKIWANIA HOSTA -->
    <div class="wait-panel hidden" id="waitPanel">
      <div style="font-family:'Orbitron'; font-size:13px; color:#8b949e; letter-spacing:2px;">KOD TWOJEGO POKOJU</div>
      <div id="roomCodeDisplay">------</div>
      <button type="button" class="action-btn" style="background:#21262d;" onclick="location.reload()">WRÓĆ</button>
    </div>
  </div>

  <!-- OBSZAR GRY -->
  <div id="gameWrapper">
    <div id="hud">
      <div class="player-box">
        <span class="team-name p1-color" id="hudP1">GRACZ 1</span>
        <div class="stamina-bar-wrap">
          <div class="stamina-fill" id="staminaP1" style="background: var(--p1);"></div>
        </div>
      </div>

      <span id="hudScore">0 : 0</span>

      <div class="player-box right">
        <span class="team-name p2-color" id="hudP2">GRACZ 2</span>
        <div class="stamina-bar-wrap">
          <div class="stamina-fill" id="staminaP2" style="background: var(--p2);"></div>
        </div>
      </div>
    </div>

    <!-- PASEK ULEPSZEŃ -->
    <div id="upgradesPanel">
      <div class="up-badge">UP: <span id="ptsDisplay">0</span></div>

      <div class="stat-item">
        <span>🌀</span>
        <div class="stat-dots" id="dots-spin"></div>
        <button type="button" class="stat-btn" id="btnSpin" onclick="upgradeStat('spin')">+1</button>
      </div>

      <div class="stat-item">
        <span>⚡</span>
        <div class="stat-dots" id="dots-speed"></div>
        <button type="button" class="stat-btn" id="btnSpeed" onclick="upgradeStat('speed')">+1</button>
      </div>

      <div class="stat-item">
        <span>💥</span>
        <div class="stat-dots" id="dots-smash"></div>
        <button type="button" class="stat-btn" id="btnSmash" onclick="upgradeStat('smash')">+1</button>
      </div>

      <div class="stat-item">
        <span>🛡️</span>
        <div class="stat-dots" id="dots-size"></div>
        <button type="button" class="stat-btn" id="btnSize" onclick="upgradeStat('size')">+1</button>
      </div>

      <div class="util-btns">
        <button type="button" class="icon-btn" id="ctrlSwitchBtn" onclick="toggleInGameControl()">⌨️ KLAWIATURA</button>
        <button type="button" class="icon-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="stage" width="900" height="500"></canvas>

      <div id="victoryModal">
        <h2 id="winnerTitle">ZWYCIĘSTWO!</h2>
        <p id="winnerSub">7 : 0</p>
        <div class="modal-actions">
          <button type="button" class="action-btn btn-host" onclick="requestRematch()">REWANŻ</button>
          <button type="button" class="action-btn" style="background:#21262d;" onclick="location.reload()">MENU</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ==========================================
   1. BLOKADA PRZEWIJANIA I PRAWEGO PRZYCISKU
   ========================================== */
// Całkowita blokada menu kontekstowego (PPM) na całej stronie
window.addEventListener('contextmenu', e => e.preventDefault());

// Blokada kółka myszy i gestów przewijania
window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ==========================================
   2. ZMIENNE GLOBALNE I KONFIGURACJA
   ========================================== */
const W = 900, H = 500;
const WIN_SCORE = 7;

const INITIAL_BALL_SPEED = 3.0;
const MAX_NORMAL_SPEED = 6.4;
const MAX_SMASH_SPEED = 8.2;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');

let gameActive = false;
let matchOver = false;
let controlMode = 'keyboard';
let mouseY = H / 2;

let peer = null, conn = null;
let isHost = true, isSinglePlayer = false, aiLevel = 'medium';
let myName = 'CYBER', oppName = 'BOT';
let keys = {};

let shakeTime = 0, shakeIntensity = 0;
let countdownTimer = 0;
let bannerText = '', bannerTimer = 0, bannerColor = '#00f0ff';

let upgradePoints = 0;
const stats = { spin: 1, speed: 1, smash: 1, size: 1 };
let rallyHits = 0;
let rallyRewarded = false;

const BASE_H = 86;
function createPaddle(x, color) {
  return {
    x, y: H / 2 - BASE_H / 2,
    w: 13, h: BASE_H,
    vy: 0, speed: 4.4,
    score: 0,
    stamina: 100,
    dashTimer: 0,
    smashCharge: 0,
    color,
    spinMult: 1, smashMult: 1
  };
}

const P1 = createPaddle(28, '#00f0ff');
const P2 = createPaddle(W - 28 - 13, '#ff0055');

const BALL = {
  x: W / 2, y: H / 2, r: 8,
  vx: 3.0, vy: 1.4,
  spin: 0,
  spinAngle: 0,
  speed: INITIAL_BALL_SPEED,
  isSmashed: false,
  trail: []
};

let obstacle = null;
let powerupOrb = null;
let particles = [];
let shockwaves = [];

function drawRoundedRect(context, x, y, w, h, r) {
  context.beginPath();
  if (context.roundRect) {
    context.roundRect(x, y, w, h, r);
  } else {
    context.rect(x, y, w, h);
  }
  context.fill();
}

/* ==========================================
   3. SYMULACJA MECZU W TLE MENU
   ========================================== */
let bgBall = { x: 400, y: 300, vx: 4.5, vy: 3.2, r: 7 };
let bgP1Y = 250, bgP2Y = 250;

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeBg);
resizeBg();

function animateMenuBg() {
  if (!gameActive) {
    const bw = bgCanvas.width, bh = bgCanvas.height;
    bgCtx.fillStyle = 'rgba(4, 6, 12, 0.28)';
    bgCtx.fillRect(0, 0, bw, bh);

    bgBall.x += bgBall.vx;
    bgBall.y += bgBall.vy;
    if (bgBall.y < 30 || bgBall.y > bh - 30) bgBall.vy *= -1;
    if (bgBall.x < 55 || bgBall.x > bw - 55) bgBall.vx *= -1;

    bgP1Y += ((bgBall.y - 50) - bgP1Y) * 0.08;
    bgP2Y += ((bgBall.y - 50) - bgP2Y) * 0.08;

    bgCtx.fillStyle = '#00f0ff';
    bgCtx.shadowColor = '#00f0ff';
    bgCtx.shadowBlur = 18;
    drawRoundedRect(bgCtx, 35, bgP1Y, 10, 100, 5);

    bgCtx.fillStyle = '#ff0055';
    bgCtx.shadowColor = '#ff0055';
    drawRoundedRect(bgCtx, bw - 45, bgP2Y, 10, 100, 5);

    bgCtx.beginPath();
    bgCtx.arc(bgBall.x, bgBall.y, bgBall.r, 0, Math.PI * 2);
    bgCtx.fillStyle = '#ffffff';
    bgCtx.shadowColor = '#00f0ff';
    bgCtx.fill();
    bgCtx.shadowBlur = 0;
  }
  requestAnimationFrame(animateMenuBg);
}
animateMenuBg();

/* ==========================================
   4. SYNTEZATOR DŹWIĘKU (Web Audio API)
   ========================================== */
const SFX = {
  ctx: null,
  muted: false,
  init() {
    try {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  play(type) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'spinHit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.13);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.13);
        osc.start(now); osc.stop(now + 0.13);
      } else if (type === 'smash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.22);
        gain.gain.setValueAtTime(0.38, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now); osc.stop(now + 0.22);
      } else if (type === 'wall') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.05);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'dash') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.setValueAtTime(390, now + 0.1);
        osc.frequency.setValueAtTime(520, now + 0.2);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'upgrade') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(660, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      }
    } catch (e) {}
  }
};

function toggleMute() {
  SFX.muted = !SFX.muted;
  document.getElementById('muteBtn').textContent = SFX.muted ? '🔇' : '🔊';
}

/* ==========================================
   5. STEROWANIE I INTERFEJS MENU
   ========================================== */
function selectControl(mode) {
  controlMode = mode;
  document.getElementById('ctrlKeyboard').classList.toggle('active', mode === 'keyboard');
  document.getElementById('ctrlMouse').classList.toggle('active', mode === 'mouse');
  const switchBtn = document.getElementById('ctrlSwitchBtn');
  if (switchBtn) {
    switchBtn.textContent = mode === 'keyboard' ? '⌨️ KLAWIATURA' : '🖱️ MYSZKA';
  }
}

function toggleInGameControl() {
  selectControl(controlMode === 'keyboard' ? 'mouse' : 'keyboard');
}

function setAiTier(level) {
  aiLevel = level;
  ['easy', 'medium', 'hard'].forEach(t => {
    document.getElementById('ai-' + t).classList.toggle('active', t === level);
  });
}

const genCode = () => Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
function setStatus(txt) {
  const el = document.getElementById('statusMsg');
  if (el) el.textContent = txt;
}

function triggerShake(frames, intensity) {
  shakeTime = frames;
  shakeIntensity = intensity;
}

function showBanner(text, color = '#00f0ff', duration = 65) {
  bannerText = text;
  bannerColor = color;
  bannerTimer = duration;
}

/* ==========================================
   6. SYSTEM ULEPSZEŃ (RPG)
   ========================================== */
function getUpgradeCost(lvl) { return lvl; }

function upgradeStat(type) {
  const currentLvl = stats[type];
  const cost = getUpgradeCost(currentLvl);
  if (upgradePoints < cost || currentLvl >= 5) return;

  upgradePoints -= cost;
  stats[type]++;
  SFX.play('upgrade');
  updateStatDisplay();
  applyStatsToLocalPlayer();
}

function updateStatDisplay() {
  document.getElementById('ptsDisplay').textContent = upgradePoints;

  const renderStat = (type, btnId) => {
    const lvl = stats[type];
    const dotsWrap = document.getElementById('dots-' + type);
    dotsWrap.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i <= lvl ? ' active' : '');
      dotsWrap.appendChild(d);
    }
    const btn = document.getElementById(btnId);
    if (lvl >= 5) {
      btn.textContent = 'MAX';
      btn.disabled = true;
    } else {
      const cost = getUpgradeCost(lvl);
      btn.textContent = `+${cost}`;
      btn.disabled = upgradePoints < cost;
    }
  };

  renderStat('spin', 'btnSpin');
  renderStat('speed', 'btnSpeed');
  renderStat('smash', 'btnSmash');
  renderStat('size', 'btnSize');
}

function applyStatsToLocalPlayer() {
  const p = isHost ? P1 : P2;
  p.speed = 4.3 + (stats.speed - 1) * 0.6;
  p.spinMult = 1 + (stats.spin - 1) * 0.24;
  p.smashMult = 1 + (stats.smash - 1) * 0.18;
  p.h = BASE_H + (stats.size - 1) * 10;
}

/* ==========================================
   7. TRYBY GRY (AI / MULTIPLAYER P2P)
   ========================================== */
function startSingleplayer() {
  SFX.init();
  myName = document.getElementById('nickInput').value.trim() || 'CYBER';
  const aiNames = { easy: 'BOT REKRUT', medium: 'BOT WETERAN', hard: 'BOT PRO' };
  oppName = aiNames[aiLevel];
  isHost = true;
  isSinglePlayer = true;
  startGame();
}

function createRoom() {
  SFX.init();
  if (typeof Peer === 'undefined') {
    setStatus('BŁĄD SIECI P2P');
    return;
  }
  myName = document.getElementById('nickInput').value.trim() || 'GRACZ 1';
  setStatus('TWORZENIE POKOJU...');
  const code = genCode();
  peer = new Peer('cyberpong-' + code);
  isHost = true;
  isSinglePlayer = false;

  peer.on('open', () => {
    document.getElementById('mainPanel').classList.add('hidden');
    document.getElementById('waitPanel').classList.remove('hidden');
    document.getElementById('roomCodeDisplay').textContent = code;
  });

  peer.on('connection', c => {
    conn = c;
    bindConnEvents();
    c.on('open', () => conn.send({ t: 'hello', name: myName }));
  });

  peer.on('error', () => setStatus('BŁĄD POŁĄCZENIA'));
}

function joinRoom() {
  SFX.init();
  if (typeof Peer === 'undefined') {
    setStatus('BŁĄD SIECI P2P');
    return;
  }
  myName = document.getElementById('nickInput').value.trim() || 'GRACZ 2';
  const code = document.getElementById('joinInput').value.trim().toUpperCase();
  if (code.length !== 6) {
    setStatus('WPISZ 6-ZNAKOWY KOD!');
    return;
  }

  setStatus('ŁĄCZENIE...');
  peer = new Peer();
  isHost = false;
  isSinglePlayer = false;

  peer.on('open', () => {
    conn = peer.connect('cyberpong-' + code);
    bindConnEvents();
    conn.on('open', () => conn.send({ t: 'hello', name: myName }));
  });

  peer.on('error', () => setStatus('NIE ZNALEZIONO POKOJU'));
}

function bindConnEvents() {
  conn.on('data', handleData);
  conn.on('close', () => {
    if (gameActive) location.reload();
  });
}

function handleData(d) {
  if (d.t === 'hello') {
    oppName = d.name;
    if (isHost) {
      conn.send({ t: 'start', opp: myName });
      startGame();
    }
  } else if (d.t === 'start') {
    oppName = d.opp;
    startGame();
  } else if (d.t === 'rematch') {
    resetMatch();
  } else if (d.t === 'fx') {
    SFX.play(d.sfx);
    if (d.shake) triggerShake(d.shake[0], d.shake[1]);
    if (d.part) addParticles(d.part.x, d.part.y, d.part.c, d.part.n);
    if (d.wave) addShockwave(d.wave.x, d.wave.y, d.wave.c);
    if (d.banner) showBanner(d.banner.txt, d.banner.c, 65);
  } else if (d.t === 'sync') {
    if (isHost) {
      P2.y = d.py;
      P2.vy = d.pvy;
      P2.h = d.ph;
      P2.stamina = d.stam;
      P2.smashCharge = d.smashCharge;
      P2.spinMult = d.spinMult;
      P2.smashMult = d.smashMult;
    } else {
      P1.y = d.p1y; P1.vy = d.p1vy; P1.h = d.p1h;
      P1.stamina = d.p1stam; P1.smashCharge = d.p1smash;
      BALL.x = d.bx; BALL.y = d.by;
      BALL.spin = d.spin; BALL.isSmashed = d.smashed;
      BALL.trail.push({ x: BALL.x, y: BALL.y });
      if (BALL.trail.length > 10) BALL.trail.shift();

      obstacle = d.obs;
      powerupOrb = d.orb;
      countdownTimer = d.cd;

      if (d.hits >= 10 && rallyHits < 10) {
        upgradePoints++;
        updateStatDisplay();
        showBanner('10+ COMBO! +1 UP', '#f5b041', 70);
        SFX.play('upgrade');
      }
      rallyHits = d.hits;

      if (P1.score !== d.s1 || P2.score !== d.s2) {
        if (d.s2 > P2.score && d.s2 % 2 === 0) {
          upgradePoints++;
          updateStatDisplay();
        }
        P1.score = d.s1; P2.score = d.s2;
        updateHudScore();
        checkVictoryCondition();
      }
    }
  }
}

function sendFX(payload) {
  if (!isSinglePlayer && conn && conn.open && isHost) {
    conn.send({ t: 'fx', ...payload });
  }
}

/* ==========================================
   8. START MECZU I RESET
   ========================================== */
function startGame() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('bgCanvas').style.display = 'none';
  document.getElementById('gameWrapper').style.display = 'flex';

  document.getElementById('hudP1').textContent = isHost ? myName : oppName;
  document.getElementById('hudP2').textContent = isHost ? oppName : myName;

  gameActive = true;
  updateStatDisplay();
  applyStatsToLocalPlayer();
  resetBall(true);
  requestAnimationFrame(gameLoop);
}

function resetBall(withCountdown = true) {
  BALL.x = W / 2;
  BALL.y = H / 2;
  BALL.speed = INITIAL_BALL_SPEED;
  BALL.spin = 0;
  BALL.isSmashed = false;
  BALL.trail = [];
  rallyHits = 0;
  rallyRewarded = false;

  if (withCountdown) countdownTimer = 105;

  const angle = (Math.random() * Math.PI / 3.4) - Math.PI / 6.8;
  const dir = Math.random() < 0.5 ? 1 : -1;
  BALL.vx = dir * BALL.speed * Math.cos(angle);
  BALL.vy = BALL.speed * Math.sin(angle);
}

function checkVictoryCondition() {
  if (P1.score >= WIN_SCORE || P2.score >= WIN_SCORE) {
    matchOver = true;
    const p1Won = P1.score >= WIN_SCORE;
    const winnerName = p1Won ? document.getElementById('hudP1').textContent : document.getElementById('hudP2').textContent;
    const modal = document.getElementById('victoryModal');
    const title = document.getElementById('winnerTitle');
    title.textContent = `🏆 ${winnerName}`;
    title.style.color = p1Won ? 'var(--p1)' : 'var(--p2)';
    document.getElementById('winnerSub').textContent = `${P1.score} : ${P2.score}`;
    modal.style.display = 'flex';
  }
}

function requestRematch() {
  if (!isSinglePlayer && conn && conn.open) {
    conn.send({ t: 'rematch' });
  }
  resetMatch();
}

function resetMatch() {
  P1.score = 0; P2.score = 0;
  P1.stamina = 100; P2.stamina = 100;
  matchOver = false;
  document.getElementById('victoryModal').style.display = 'none';
  updateHudScore();
  resetBall(true);
}

/* ==========================================
   9. SZTUCZNA INTELIGENCJA (BOT)
   ========================================== */
function updateAI() {
  const cfg = {
    easy:   { speed: 3.3, reactX: W * 0.50, err: 26, smashChance: 0.12, dashChance: 0.01 },
    medium: { speed: 4.5, reactX: W * 0.35, err: 12, smashChance: 0.45, dashChance: 0.03 },
    hard:   { speed: 5.7, reactX: W * 0.18, err: 4,  smashChance: 0.75, dashChance: 0.08 }
  }[aiLevel];

  P2.speed = cfg.speed;
  P2.stamina = Math.min(100, P2.stamina + 0.35);
  if (P2.smashCharge > 0) P2.smashCharge--;
  if (P2.dashTimer > 0) P2.dashTimer--;

  let targetY = H / 2 - P2.h / 2;
  if (BALL.vx > 0 && BALL.x > cfg.reactX) {
    const offset = Math.sin(Date.now() * 0.004) * cfg.err;
    targetY = BALL.y - P2.h / 2 + offset;
  }

  const diff = targetY - P2.y;
  let moveDir = 0;
  if (Math.abs(diff) > 6) moveDir = diff > 0 ? 1 : -1;

  let curSpeed = P2.speed;
  if (BALL.vx > 0 && BALL.x > W - 220 && Math.abs(diff) > 75 && P2.stamina >= 35 && Math.random() < cfg.dashChance) {
    P2.stamina -= 35;
    P2.dashTimer = 10;
    SFX.play('dash');
    addParticles(P2.x + P2.w / 2, P2.y + P2.h / 2, P2.color, 10);
  }
  if (P2.dashTimer > 0) curSpeed *= 2.0;

  if (BALL.vx > 0 && BALL.x > W - 105 && Math.abs(diff) < 45 && P2.stamina >= 40 && P2.smashCharge === 0) {
    if (Math.random() < cfg.smashChance) {
      P2.stamina -= 40;
      P2.smashCharge = 22;
    }
  }

  P2.vy = moveDir * curSpeed;
  P2.y = Math.max(10, Math.min(H - P2.h - 10, P2.y + P2.vy));
}

/* ==========================================
   10. FIZYKA BOISKA I PODKRĘCENIE MAGNUSA
   ========================================== */
function addParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.2 + Math.random() * 4.0;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1.0,
      color
    });
  }
}

function addShockwave(x, y, color) {
  shockwaves.push({ x, y, r: 6, alpha: 0.9, color });
}

function updateHudScore() {
  document.getElementById('hudScore').textContent = `${P1.score} : ${P2.score}`;
}

function triggerLocalDash(myPaddle) {
  if (myPaddle.dashTimer === 0 && myPaddle.stamina >= 35) {
    myPaddle.stamina -= 35;
    myPaddle.dashTimer = 11;
    SFX.play('dash');
    addParticles(myPaddle.x + myPaddle.w / 2, myPaddle.y + myPaddle.h / 2, myPaddle.color, 10);
  }
}

function triggerLocalSmash(myPaddle) {
  if (myPaddle.smashCharge === 0 && myPaddle.stamina >= 40) {
    myPaddle.stamina -= 40;
    myPaddle.smashCharge = 25;
  }
}

function update() {
  if (matchOver) return;

  const myPaddle = isHost ? P1 : P2;

  myPaddle.stamina = Math.min(100, myPaddle.stamina + 0.35);
  if (myPaddle.dashTimer > 0) myPaddle.dashTimer--;
  if (myPaddle.smashCharge > 0) myPaddle.smashCharge--;

  const maxStep = myPaddle.speed * (myPaddle.dashTimer > 0 ? 2.1 : 1);

  if (controlMode === 'keyboard') {
    let moveDir = 0;
    if (keys['KeyW'] || keys['ArrowUp']) moveDir -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveDir += 1;

    if ((keys['ShiftLeft'] || keys['ShiftRight']) && moveDir !== 0) {
      triggerLocalDash(myPaddle);
    }
    if (keys['Space']) {
      keys['Space'] = false;
      triggerLocalSmash(myPaddle);
    }

    myPaddle.vy = moveDir * maxStep;
    myPaddle.y = Math.max(10, Math.min(H - myPaddle.h - 10, myPaddle.y + myPaddle.vy));
  } else {
    const targetY = mouseY - myPaddle.h / 2;
    const diff = targetY - myPaddle.y;
    if (Math.abs(diff) < 1.5) {
      myPaddle.vy = 0;
    } else {
      const step = Math.sign(diff) * Math.min(Math.abs(diff), maxStep);
      myPaddle.vy = step;
      myPaddle.y = Math.max(10, Math.min(H - myPaddle.h - 10, myPaddle.y + step));
    }
  }

  if (isSinglePlayer) updateAI();

  document.getElementById('staminaP1').style.width = P1.stamina + '%';
  document.getElementById('staminaP2').style.width = P2.stamina + '%';

  BALL.spinAngle += BALL.spin * 0.14;

  if (isHost) {
    if (countdownTimer > 0) {
      countdownTimer--;
    } else {
      if (!obstacle && Math.random() < 0.001) {
        obstacle = {
          x: W / 2 - 9,
          y: 70 + Math.random() * (H - 220),
          w: 18, h: 85,
          vy: Math.random() < 0.5 ? 1.0 : -1.0,
          timer: 260
        };
      }
      if (obstacle) {
        obstacle.timer--;
        obstacle.y += obstacle.vy;
        if (obstacle.y <= 30 || obstacle.y + obstacle.h >= H - 30) obstacle.vy *= -1;
        if (obstacle.timer <= 0) obstacle = null;
      }

      if (!powerupOrb && Math.random() < 0.0008) {
        powerupOrb = {
          x: W / 2 + (Math.random() - 0.5) * 180,
          y: 70 + Math.random() * (H - 140),
          r: 14, timer: 360
        };
      }
      if (powerupOrb) {
        powerupOrb.timer--;
        const dx = BALL.x - powerupOrb.x, dy = BALL.y - powerupOrb.y;
        if (Math.hypot(dx, dy) <= BALL.r + powerupOrb.r) {
          if (BALL.vx > 0) {
            upgradePoints++; updateStatDisplay();
            showBanner('+1 UP', '#f5b041', 65);
          }
          SFX.play('upgrade');
          addShockwave(powerupOrb.x, powerupOrb.y, '#f5b041');
          addParticles(powerupOrb.x, powerupOrb.y, '#f5b041', 16);
          sendFX({ sfx: 'upgrade', wave: { x: powerupOrb.x, y: powerupOrb.y, c: '#f5b041' } });
          powerupOrb = null;
        } else if (powerupOrb.timer <= 0) {
          powerupOrb = null;
        }
      }

      if (Math.abs(BALL.spin) > 0.05) {
        BALL.vy += BALL.spin * 0.035;
        const signX = Math.sign(BALL.vx) || 1;
        const maxVy = BALL.speed * 0.82;
        BALL.vy = Math.max(-maxVy, Math.min(maxVy, BALL.vy));
        BALL.vx = signX * Math.sqrt(Math.max(1.5, BALL.speed * BALL.speed - BALL.vy * BALL.vy));
        BALL.spin *= 0.991;
      } else {
        BALL.spin = 0;
      }

      BALL.x += BALL.vx;
      BALL.y += BALL.vy;

      BALL.trail.push({ x: BALL.x, y: BALL.y });
      if (BALL.trail.length > 11) BALL.trail.shift();

      if (BALL.y - BALL.r <= 0 || BALL.y + BALL.r >= H) {
        BALL.y = BALL.y - BALL.r <= 0 ? BALL.r : H - BALL.r;
        BALL.vy *= -1;

        if (Math.abs(BALL.spin) > 0.8) {
          BALL.vy += BALL.spin * 0.32;
          BALL.spin *= -0.55;
          addParticles(BALL.x, BALL.y, '#b845ff', 9);
          sendFX({ sfx: 'wall', part: { x: BALL.x, y: BALL.y, c: '#b845ff', n: 9 } });
        } else {
          addParticles(BALL.x, BALL.y, '#ffffff', 5);
          sendFX({ sfx: 'wall', part: { x: BALL.x, y: BALL.y, c: '#ffffff', n: 5 } });
        }
        SFX.play('wall');
      }

      if (obstacle &&
          BALL.x + BALL.r >= obstacle.x && BALL.x - BALL.r <= obstacle.x + obstacle.w &&
          BALL.y + BALL.r >= obstacle.y && BALL.y - BALL.r <= obstacle.y + obstacle.h) {
        BALL.vx *= -1;
        BALL.x += BALL.vx * 2;
        SFX.play('wall');
        addShockwave(BALL.x, BALL.y, '#a371f7');
        addParticles(BALL.x, BALL.y, '#a371f7', 10);
        sendFX({ sfx: 'wall', wave: { x: BALL.x, y: BALL.y, c: '#a371f7' } });
      }

      if (BALL.vx < 0 && BALL.x - BALL.r <= P1.x + P1.w && BALL.x + BALL.r >= P1.x &&
          BALL.y + BALL.r >= P1.y && BALL.y - BALL.r <= P1.y + P1.h) {
        handlePaddleHit(P1, 1);
      }

      if (BALL.vx > 0 && BALL.x + BALL.r >= P2.x && BALL.x - BALL.r <= P2.x + P2.w &&
          BALL.y + BALL.r >= P2.y && BALL.y - BALL.r <= P2.y + P2.h) {
        handlePaddleHit(P2, -1);
      }

      if (BALL.x < -15) {
        P2.score++;
        onGoalScored(2);
      } else if (BALL.x > W + 15) {
        P1.score++;
        onGoalScored(1);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.035;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += 2.5; sw.alpha -= 0.04;
    if (sw.alpha <= 0) shockwaves.splice(i, 1);
  }

  if (shakeTime > 0) shakeTime--;
  if (bannerTimer > 0) bannerTimer--;

  if (!isSinglePlayer && conn && conn.open) {
    if (isHost) {
      conn.send({
        t: 'sync',
        p1y: P1.y, p1vy: P1.vy, p1h: P1.h, p1stam: P1.stamina, p1smash: P1.smashCharge,
        bx: BALL.x, by: BALL.y, spin: BALL.spin, smashed: BALL.isSmashed,
        obs: obstacle, orb: powerupOrb, cd: countdownTimer, hits: rallyHits,
        s1: P1.score, s2: P2.score
      });
    } else {
      conn.send({
        t: 'sync',
        py: P2.y, pvy: P2.vy, ph: P2.h, stam: P2.stamina,
        smashCharge: P2.smashCharge,
        spinMult: P2.spinMult, smashMult: P2.smashMult
      });
    }
  }
}

function handlePaddleHit(paddle, dir) {
  BALL.x = dir === 1 ? P1.x + P1.w + BALL.r : P2.x - BALL.r;
  rallyHits++;

  if (rallyHits === 10 && !rallyRewarded) {
    rallyRewarded = true;
    upgradePoints++;
    updateStatDisplay();
    showBanner('10+ COMBO! +1 UP', '#f5b041', 70);
    SFX.play('upgrade');
  }

  const collidePoint = (BALL.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
  const clampedPoint = Math.max(-1, Math.min(1, collidePoint));
  const angle = clampedPoint * (Math.PI / 3.6);

  const isSmash = paddle.smashCharge > 0;
  paddle.smashCharge = 0;

  const rawSpin = (paddle.vy * 0.32 * paddle.spinMult) + (clampedPoint * 0.45 * (paddle.spinMult - 0.8));
  BALL.spin = Math.max(-2.8, Math.min(2.8, rawSpin));
  const isHeavySpin = Math.abs(BALL.spin) >= 1.3;

  if (isSmash) {
    BALL.speed = Math.min(BALL.speed + 0.8 * paddle.smashMult, MAX_SMASH_SPEED);
    BALL.isSmashed = true;
    SFX.play('smash');
    triggerShake(11, 6);
    addShockwave(BALL.x, BALL.y, '#f5b041');
    addParticles(BALL.x, BALL.y, '#f5b041', 16);
    showBanner('SMASH!', paddle.color, 40);
    sendFX({
      sfx: 'smash', shake: [11, 6],
      wave: { x: BALL.x, y: BALL.y, c: '#f5b041' },
      part: { x: BALL.x, y: BALL.y, c: '#f5b041', n: 16 },
      banner: { txt: 'SMASH!', c: paddle.color }
    });
  } else {
    BALL.speed = Math.min(BALL.speed + 0.11, MAX_NORMAL_SPEED);
    BALL.isSmashed = false;
    const hitSfx = isHeavySpin ? 'spinHit' : 'hit';
    const fxColor = isHeavySpin ? '#b845ff' : paddle.color;
    SFX.play(hitSfx);
    addShockwave(BALL.x, BALL.y, fxColor);
    addParticles(BALL.x, BALL.y, fxColor, isHeavySpin ? 12 : 7);

    if (isHeavySpin) showBanner('CURVEBALL!', '#b845ff', 35);

    sendFX({
      sfx: hitSfx,
      wave: { x: BALL.x, y: BALL.y, c: fxColor },
      part: { x: BALL.x, y: BALL.y, c: fxColor, n: isHeavySpin ? 12 : 7 },
      banner: isHeavySpin ? { txt: 'CURVEBALL!', c: '#b845ff' } : null
    });
  }

  BALL.vx = dir * BALL.speed * Math.cos(angle);
  BALL.vy = BALL.speed * Math.sin(angle);
}

function onGoalScored(scorer) {
  SFX.play('goal');
  triggerShake(14, 8);
  const goalColor = scorer === 1 ? P1.color : P2.color;
  showBanner('PUNKT!', goalColor, 65);
  sendFX({ sfx: 'goal', shake: [14, 8], banner: { txt: 'PUNKT!', c: goalColor } });

  if (scorer === 1 && P1.score % 2 === 0) {
    upgradePoints++;
    updateStatDisplay();
  }

  updateHudScore();
  checkVictoryCondition();
  if (!matchOver) resetBall(true);
}

/* ==========================================
   11. RENDEROWANIE ARENY
   ========================================== */
function render() {
  ctx.save();

  if (shakeTime > 0) {
    const dx = (Math.random() - 0.5) * shakeIntensity;
    const dy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(dx, dy);
  }

  ctx.fillStyle = '#060911';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.035)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 45) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 45) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  ctx.strokeStyle = '#182236';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2);
  ctx.stroke();

  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  if (rallyHits >= 3) {
    ctx.font = '900 46px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillStyle = rallyHits >= 10 ? 'rgba(245, 176, 65, 0.15)' : 'rgba(255, 255, 255, 0.06)';
    ctx.fillText(`${rallyHits} COMBO`, W / 2, H / 2 + 16);
  }

  if (obstacle) {
    ctx.shadowColor = '#a371f7';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#a371f7';
    drawRoundedRect(ctx, obstacle.x, obstacle.y, obstacle.w, obstacle.h, 6);
    ctx.shadowBlur = 0;
  }

  if (powerupOrb) {
    const pulse = Math.sin(Date.now() * 0.01) * 3;
    ctx.shadowColor = '#f5b041';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#f5b041';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(powerupOrb.x, powerupOrb.y, powerupOrb.r + pulse, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#f5b041';
    ctx.font = '900 11px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText('+UP', powerupOrb.x, powerupOrb.y + 4);
    ctx.shadowBlur = 0;
  }

  shockwaves.forEach(sw => {
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = sw.alpha;
    ctx.stroke();
    ctx.globalAlpha = 1.0;
  });

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1.0;
  });

  const drawPaddle = (p) => {
    const isCharging = p.smashCharge > 0;
    ctx.shadowColor = isCharging ? '#f5b041' : p.color;
    ctx.shadowBlur = isCharging ? 24 : 14;
    ctx.fillStyle = isCharging ? '#f5b041' : p.color;
    drawRoundedRect(ctx, p.x, p.y, p.w, p.h, 6);

    ctx.fillStyle = '#ffffff';
    drawRoundedRect(ctx, p.x + 3, p.y + 8, p.w - 6, p.h - 16, 3);
    ctx.shadowBlur = 0;
  };

  drawPaddle(P1);
  drawPaddle(P2);

  const hasSpin = Math.abs(BALL.spin) > 0.65;

  BALL.trail.forEach((t, i) => {
    const ratio = i / BALL.trail.length;
    ctx.beginPath();
    ctx.arc(t.x, t.y, BALL.r * ratio, 0, Math.PI * 2);
    if (BALL.isSmashed) {
      ctx.fillStyle = `rgba(245, 176, 65, ${ratio * 0.45})`;
    } else if (hasSpin) {
      ctx.fillStyle = `rgba(184, 69, 255, ${ratio * 0.38})`;
    } else {
      ctx.fillStyle = `rgba(0, 240, 255, ${ratio * 0.22})`;
    }
    ctx.fill();
  });

  if (hasSpin) {
    ctx.save();
    ctx.translate(BALL.x, BALL.y);
    ctx.rotate(BALL.spinAngle);
    ctx.strokeStyle = '#b845ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, BALL.r + 5, 0, Math.PI * 0.75);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, BALL.r + 5, Math.PI, Math.PI * 1.75);
    ctx.stroke();
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(BALL.x, BALL.y, BALL.r, 0, Math.PI * 2);
  ctx.fillStyle = BALL.isSmashed ? '#f5b041' : '#ffffff';
  ctx.shadowColor = BALL.isSmashed ? '#f5b041' : (hasSpin ? '#b845ff' : '#00f0ff');
  ctx.shadowBlur = BALL.isSmashed ? 22 : 14;
  ctx.fill();
  ctx.shadowBlur = 0;

  if (bannerTimer > 0) {
    ctx.font = '900 32px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillStyle = bannerColor;
    ctx.shadowColor = bannerColor;
    ctx.shadowBlur = 15;
    ctx.fillText(bannerText, W / 2, 72);
    ctx.shadowBlur = 0;
  }

  if (countdownTimer > 0) {
    const sec = Math.ceil(countdownTimer / 35);
    ctx.font = '900 62px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 20;
    ctx.fillText(sec > 0 ? sec : 'GO!', W / 2, H / 2 - 35);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function gameLoop() {
  if (!gameActive) return;
  update();
  render();
  requestAnimationFrame(gameLoop);
}

/* ==========================================
   12. OBSŁUGA KLAWIATURY I MYSZKI (NA CAŁYM OKNIE)
   ========================================== */
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code) && gameActive) {
    e.preventDefault();
  }
  if (gameActive) {
    if (e.code === 'Digit1') upgradeStat('spin');
    if (e.code === 'Digit2') upgradeStat('speed');
    if (e.code === 'Digit3') upgradeStat('smash');
    if (e.code === 'Digit4') upgradeStat('size');
  }
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

// Śledzenie myszy na całym oknie, żeby kursor nie gubił paletki poza ramką
window.addEventListener('mousemove', e => {
  if (!gameActive) return;
  const rect = canvas.getBoundingClientRect();
  if (rect.height > 0) {
    const scaleY = H / rect.height;
    mouseY = (e.clientY - rect.top) * scaleY;
  }
});

// Kliknięcia LPM i PPM podczas gry (z pominięciem przycisków interfejsu)
window.addEventListener('mousedown', e => {
  if (!gameActive || matchOver || controlMode !== 'mouse') return;
  if (e.target.tagName === 'BUTTON') return;

  const myPaddle = isHost ? P1 : P2;
  if (e.button === 0) {
    triggerLocalSmash(myPaddle);
  } else if (e.button === 2) {
    e.preventDefault();
    triggerLocalDash(myPaddle);
  }
});
</script>
