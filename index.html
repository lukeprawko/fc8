<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC 28 - Piłka Nożna 2D</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }

  body {
    background-color: #0d1117;
    color: #f0f6fc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #2ea44f;
    text-shadow: 0 0 10px rgba(46, 164, 79, 0.4);
  }
  .header p {
    color: #8b949e;
    font-size: 14px;
    margin-top: 4px;
  }

  /* PANEL MENU */
  .panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px;
    width: 360px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    text-align: center;
  }

  .input-group {
    margin-bottom: 14px;
    text-align: left;
  }
  .input-group label {
    display: block;
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #58a6ff; }

  .divider {
    margin: 16px 0;
    border-bottom: 1px solid #21262d;
    position: relative;
  }
  .divider span {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #161b22;
    padding: 0 8px;
    color: #484f58;
    font-size: 12px;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: #238636; color: #fff; }
  .btn-primary:hover { background: #2ea44f; }
  .btn-secondary { background: #1f6feb; color: #fff; }
  .btn-secondary:hover { background: #388bfd; }
  .btn-cancel { background: #21262d; color: #c9d1d9; margin-top: 10px; }
  .btn-cancel:hover { background: #30363d; }

  #roomCodeDisplay {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #58a6ff;
    margin: 12px 0;
    background: #0d1117;
    padding: 10px;
    border-radius: 6px;
    border: 1px dashed #30363d;
  }

  .status-msg {
    margin-top: 12px;
    font-size: 13px;
    color: #e3b341;
    min-height: 18px;
  }

  /* GRA & HUD */
  #gameWrapper { display: none; text-align: center; }

  #hud {
    width: 960px;
    max-width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-bottom: none;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-board {
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .team-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p1-color { color: #58a6ff; }
  .p2-color { color: #f85149; }
  #timerBox {
    background: #0d1117;
    padding: 4px 12px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 18px;
    border: 1px solid #21262d;
  }

  canvas {
    background: #1e532b;
    border: 1px solid #30363d;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    display: block;
  }

  .controls-bar {
    margin-top: 12px;
    color: #8b949e;
    font-size: 13px;
  }
  .controls-bar span {
    background: #161b22;
    border: 1px solid #30363d;
    padding: 2px 6px;
    border-radius: 4px;
    color: #c9d1d9;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>FC 28</h1>
  <p>Stabilny Mecz Piłkarski Multiplayer</p>
</div>

<!-- MENU POKOJU -->
<div id="menu">
  <div class="panel" id="mainPanel">
    <div class="input-group">
      <label>TWÓJ NICK</label>
      <input id="nickInput" maxlength="12" placeholder="Gracz 1" value="Gracz">
    </div>
    
    <button class="btn-primary" onclick="createRoom()">Stwórz Nowy Pokój</button>
    
    <div class="divider"><span>LUB</span></div>
    
    <div class="input-group">
      <label>KOD POKOJU</label>
      <input id="joinInput" maxlength="6" placeholder="np. ABC123" style="text-transform:uppercase;">
    </div>
    <button class="btn-secondary" onclick="joinRoom()">Dołącz do Gry</button>
    
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="panel hidden" id="waitPanel">
    <div style="font-size:14px; color:#8b949e;">Twój kod pokoju:</div>
    <div id="roomCodeDisplay">------</div>
    <div class="status-msg">Oczekiwanie na połączenie przeciwnika...</div>
    <button class="btn-cancel" onclick="location.reload()">Anuluj</button>
  </div>
</div>

<!-- OBSZAR GRY -->
<div id="gameWrapper">
  <div id="hud">
    <div class="score-board">
      <span class="team-name p1-color" id="hudP1">Gracz 1</span>
      <span id="hudScore" style="background:#0d1117; padding:2px 10px; border-radius:4px;">0 : 0</span>
      <span class="team-name p2-color" id="hudP2">Gracz 2</span>
    </div>
    <div id="timerBox">03:00</div>
  </div>

  <canvas id="stage" width="960" height="540"></canvas>

  <div class="controls-bar">
    Ruch: <span>W A S D</span> / <span>Strzałki</span> | Sprint: <span>SHIFT</span> | Strzał: <span>SPACJA</span> / <span>J</span> | Podanie: <span>K</span>
  </div>
</div>

<script>
/* --- KONFIGURACJA BOISKA I MECHANIKI --- */
const W = 960, H = 540;
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const MARGIN = 40;
const GOAL_H = 130;
const GOAL_TOP = H/2 - GOAL_H/2;
const GOAL_BOT = H/2 + GOAL_H/2;
const GOAL_DEPTH = 30;

// Stan Gry
let peer = null, conn = null, isHost = false;
let myName = 'Gracz', oppName = 'Przeciwnik';
let gameActive = false, startTime = 0;
let keys = {};

// Obiekty
const ME = { x: 200, y: H/2, vx: 0, vy: 0, r: 16, color: '#58a6ff', faceX: 1, faceY: 0 };
const OPP = { x: 760, y: H/2, vx: 0, vy: 0, r: 16, color: '#f85149', faceX: -1, faceY: 0 };
const GK1 = { x: MARGIN + 15, y: H/2, vx: 0, vy: 0, r: 16, color: '#e3b341' };
const GK2 = { x: W - MARGIN - 15, y: H/2, vx: 0, vy: 0, r: 16, color: '#e3b341' };
const BALL = { x: W/2, y: H/2, vx: 0, vy: 0, r: 8 };

let score1 = 0, score2 = 0;
let goalBannerTimer = 0, goalText = '';

/* --- MULTIPLAYER (PEERJS) --- */
const genCode = () => Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*30)]).join('');

function setStatus(txt) { document.getElementById('statusMsg').textContent = txt; }

function createRoom() {
  myName = document.getElementById('nickInput').value.trim() || 'Gospodarz';
  setStatus('Tworzenie pokoju...');
  const code = genCode();
  peer = new Peer('fc28-' + code);
  isHost = true;

  peer.on('open', () => {
    document.getElementById('mainPanel').classList.add('hidden');
    document.getElementById('waitPanel').classList.remove('hidden');
    document.getElementById('roomCodeDisplay').textContent = code;
  });

  peer.on('connection', c => {
    conn = c;
    bindConnEvents();
    c.on('open', () => conn.send({ t: 'hello', name: myName }));
  });

  peer.on('error', err => setStatus('Błąd połączenia: ' + err.type));
}

function joinRoom() {
  myName = document.getElementById('nickInput').value.trim() || 'Gość';
  const code = document.getElementById('joinInput').value.trim().toUpperCase();
  if (code.length !== 6) { setStatus('Wpisz poprawny 6-cyfrowy kod!'); return; }
  
  setStatus('Łączenie z pokojem...');
  peer = new Peer();
  isHost = false;

  peer.on('open', () => {
    conn = peer.connect('fc28-' + code);
    bindConnEvents();
    conn.on('open', () => {
      conn.send({ t: 'hello', name: myName });
    });
  });

  peer.on('error', () => setStatus('Nie odnaleziono pokoju!'));
}

function bindConnEvents() {
  conn.on('data', handleData);
  conn.on('close', () => { if (gameActive) alert('Przeciwnik rozłączył się.'); location.reload(); });
}

function handleData(d) {
  if (d.t === 'hello') {
    oppName = d.name;
    if (isHost) {
      conn.send({ t: 'start', opp: myName });
      startGame();
    }
  }
  else if (d.t === 'start') {
    oppName = d.opp;
    startGame();
  }
  else if (d.t === 'sync') {
    OPP.x = d.px; OPP.y = d.py; OPP.vx = d.pvx; OPP.vy = d.pvy;
    if (!isHost) {
      BALL.x = d.bx; BALL.y = d.by; BALL.vx = d.bvx; BALL.vy = d.bvy;
      GK1.x = d.gk1x; GK1.y = d.gk1y; GK2.x = d.gk2x; GK2.y = d.gk2y;
      score1 = d.s1; score2 = d.s2; updateHudScore();
    }
  }
  else if (d.t === 'goal') {
    goalText = d.who + ' STRZELA GOLA!';
    goalBannerTimer = 90;
    resetPositions(d.dir);
  }
}

function startGame() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameWrapper').style.display = 'block';

  document.getElementById('hudP1').textContent = isHost ? myName : oppName;
  document.getElementById('hudP2').textContent = isHost ? oppName : myName;
  
  ME.color = isHost ? '#58a6ff' : '#f85149';
  OPP.color = isHost ? '#f85149' : '#58a6ff';

  gameActive = true;
  startTime = Date.now();
  resetPositions(0);
  requestAnimationFrame(gameLoop);
}

function resetPositions(kickoffDir) {
  ME.x = isHost ? 260 : 700; ME.y = H/2; ME.vx = 0; ME.vy = 0;
  OPP.x = isHost ? 700 : 260; OPP.y = H/2; OPP.vx = 0; OPP.vy = 0;
  GK1.x = MARGIN + 15; GK1.y = H/2;
  GK2.x = W - MARGIN - 15; GK2.y = H/2;
  BALL.x = W/2; BALL.y = H/2; BALL.vx = kickoffDir * 2; BALL.vy = 0;
}

function updateHudScore() {
  document.getElementById('hudScore').textContent = (isHost ? score1 : score2) + ' : ' + (isHost ? score2 : score1);
}

/* --- LOGIKA ROZGRYWKI (OPTYMALIZOWANA DLA STABILNOŚCI) --- */
function updatePlayer(p, isMe) {
  if (isMe) {
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
    const maxSpeed = isSprinting ? 4.2 : 2.8;
    const accel = 0.4;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      p.vx += (dx / len) * accel;
      p.vy += (dy / len) * accel;
      p.faceX = dx / len; p.faceY = dy / len;
    }
  }

  p.vx *= 0.82; p.vy *= 0.82; // Tarcie zawodnika
  const speed = Math.hypot(p.vx, p.vy);
  if (speed > 4.5) { p.vx = (p.vx / speed) * 4.5; p.vy = (p.vy / speed) * 4.5; }

  p.x += p.vx; p.y += p.vy;

  // Granice boiska dla gracza
  p.x = Math.max(MARGIN + p.r, Math.min(W - MARGIN - p.r, p.x));
  p.y = Math.max(MARGIN + p.r, Math.min(H - MARGIN - p.r, p.y));
}

function handleKick(p) {
  const dist = Math.hypot(BALL.x - p.x, BALL.y - p.y);
  
  // STRZAŁ
  if ((keys['Space'] || keys['KeyJ']) && dist < p.r + BALL.r + 8) {
    BALL.vx = p.faceX * 9 + p.vx * 0.3;
    BALL.vy = p.faceY * 9 + p.vy * 0.3;
  }
  // PODANIE
  else if (keys['KeyK'] && dist < p.r + BALL.r + 8) {
    BALL.vx = p.faceX * 5.5;
    BALL.vy = p.faceY * 5.5;
  }
  // PROWADZENIE
  else if (dist < p.r + BALL.r + 2) {
    BALL.vx = p.vx * 0.9;
    BALL.vy = p.vy * 0.9;
    BALL.x = p.x + p.faceX * (p.r + BALL.r);
    BALL.y = p.y + p.faceY * (p.r + BALL.r);
  }
}

function updateAI() {
  [ {gk: GK1, targetX: MARGIN + 15}, {gk: GK2, targetX: W - MARGIN - 15} ].forEach(item => {
    const gk = item.gk;
    const targetY = Math.max(GOAL_TOP + gk.r, Math.min(GOAL_BOT - gk.r, BALL.y));
    gk.y += (targetY - gk.y) * 0.08;
    gk.x += (item.targetX - gk.x) * 0.08;

    // Odbicie piłki od bramkarza
    const dist = Math.hypot(BALL.x - gk.x, BALL.y - gk.y);
    if (dist < gk.r + BALL.r) {
      BALL.vx = (BALL.x - gk.x) * 0.3;
      BALL.vy = (BALL.y - gk.y) * 0.3;
    }
  });
}

function updateBall() {
  BALL.x += BALL.vx; BALL.y += BALL.vy;
  BALL.vx *= 0.975; BALL.vy *= 0.975; // Zmniejszona prędkość toczenia

  const BOUNCE = -0.65;

  // Ściany górne i dolne
  if (BALL.y - BALL.r < MARGIN) { BALL.y = MARGIN + BALL.r; BALL.vy *= BOUNCE; }
  if (BALL.y + BALL.r > H - MARGIN) { BALL.y = H - MARGIN - BALL.r; BALL.vy *= BOUNCE; }

  // Sprawdzanie czy piłka mieści się w bramce
  const insideGoalY = (BALL.y - BALL.r >= GOAL_TOP) && (BALL.y + BALL.r <= GOAL_BOT);

  if (!insideGoalY) {
    if (BALL.x - BALL.r < MARGIN) { BALL.x = MARGIN + BALL.r; BALL.vx *= BOUNCE; }
    if (BALL.x + BALL.r > W - MARGIN) { BALL.x = W - MARGIN - BALL.r; BALL.vx *= BOUNCE; }
  } else {
    // Siatki bramkowe (z tyłu)
    if (BALL.x < MARGIN - GOAL_DEPTH) { BALL.x = MARGIN - GOAL_DEPTH; BALL.vx *= -0.3; }
    if (BALL.x > W - MARGIN + GOAL_DEPTH) { BALL.x = W - MARGIN + GOAL_DEPTH; BALL.vx *= -0.3; }
  }

  // AWARYJNE ZABEZPIECZENIE: Piłka NIGDY nie zniknie poza ekranem
  BALL.x = Math.max(10, Math.min(W - 10, BALL.x));
  BALL.y = Math.max(10, Math.min(H - 10, BALL.y));
}

function checkGoals() {
  const inGoalY = (BALL.y >= GOAL_TOP) && (BALL.y <= GOAL_BOT);

  if (inGoalY) {
    if (BALL.x < MARGIN - 10) {
      score2++; updateHudScore();
      if (isHost) conn.send({ t: 'goal', who: oppName, dir: 1 });
      goalText = oppName + ' STRZELA GOLA!'; goalBannerTimer = 90; resetPositions(1);
    }
    else if (BALL.x > W - MARGIN + 10) {
      score1++; updateHudScore();
      if (isHost) conn.send({ t: 'goal', who: myName, dir: -1 });
      goalText = myName + ' STRZELA GOLA!'; goalBannerTimer = 90; resetPositions(-1);
    }
  }
}

/* --- MAIN LOOP --- */
let netTick = 0;
function gameLoop() {
  if (!gameActive) return;

  updatePlayer(ME, true);
  handleKick(ME);

  if (isHost) {
    updateBall();
    updateAI();
    checkGoals();
  }

  // Synchronizacja sieciowa
  netTick++;
  if (netTick % 2 === 0 && conn && conn.open) {
    if (isHost) {
      conn.send({
        t: 'sync', px: ME.x, py: ME.y, pvx: ME.vx, pvy: ME.vy,
        bx: BALL.x, by: BALL.y, bvx: BALL.vx, bvy: BALL.vy,
        gk1x: GK1.x, gk1y: GK1.y, gk2x: GK2.x, gk2y: GK2.y,
        s1: score1, s2: score2
      });
    } else {
      conn.send({ t: 'sync', px: ME.x, py: ME.y, pvx: ME.vx, pvy: ME.vy });
    }
  }

  // Czas meczu
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const remaining = Math.max(0, 180 - elapsed);
  const m = Math.floor(remaining / 60), s = remaining % 60;
  document.getElementById('timerBox').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  if (goalBannerTimer > 0) goalBannerTimer--;

  render();
  requestAnimationFrame(gameLoop);
}

/* --- RENDEROWANIE (GRAFIKA BOISKA I OBIEKTÓW) --- */
function render() {
  // Murawa
  ctx.fillStyle = '#1e532b';
  ctx.fillRect(0, 0, W, H);

  // Pasy na murawie
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = MARGIN; i < W - MARGIN; i += 80) {
    ctx.fillRect(i, MARGIN, 40, H - 2 * MARGIN);
  }

  // Linie
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 3;
  ctx.strokeRect(MARGIN, MARGIN, W - 2 * MARGIN, H - 2 * MARGIN);

  // Środek
  ctx.beginPath(); ctx.moveTo(W/2, MARGIN); ctx.lineTo(W/2, H - MARGIN); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI * 2); ctx.stroke();

  // Pola karne
  ctx.strokeRect(MARGIN, H/2 - 90, 100, 180);
  ctx.strokeRect(W - MARGIN - 100, H/2 - 90, 100, 180);

  // Bramki
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
  ctx.strokeRect(MARGIN - GOAL_DEPTH, GOAL_TOP, GOAL_DEPTH, GOAL_H);
  ctx.strokeRect(W - MARGIN, GOAL_TOP, GOAL_DEPTH, GOAL_H);

  // Postacie
  drawEntity(GK1); drawEntity(GK2);
  drawEntity(OPP); drawEntity(ME);

  // Cień i Piłka
  ctx.beginPath(); ctx.arc(BALL.x + 2, BALL.y + 2, BALL.r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();

  ctx.beginPath(); ctx.arc(BALL.x, BALL.y, BALL.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5; ctx.stroke();

  // Baner Gola
  if (goalBannerTimer > 0) {
    ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
    ctx.fillRect(0, H/2 - 40, W, 80);
    ctx.fillStyle = '#e3b341';
    ctx.font = 'bold 32px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(goalText, W/2, H/2 + 10);
  }
}

function drawEntity(e) {
  // Cień
  ctx.beginPath(); ctx.arc(e.x + 2, e.y + 2, e.r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();

  // Ciało
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
  ctx.fillStyle = e.color; ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

  // Wskaźnik obrotu
  if (e.faceX !== undefined) {
    ctx.beginPath();
    ctx.arc(e.x + e.faceX * 9, e.y + e.faceY * 9, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
  }
}

/* --- KONTROLA KLAWIATURY --- */
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
</script>
</body>
</html>
