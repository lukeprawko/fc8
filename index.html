<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Multiplayer 2D</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }

  body {
    background-color: #0d1117;
    color: #f0f6fc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #58a6ff;
    text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
  }
  .header p {
    color: #8b949e;
    font-size: 14px;
    margin-top: 4px;
  }

  /* PANEL MENU */
  .panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px;
    width: 360px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    text-align: center;
  }

  .input-group {
    margin-bottom: 14px;
    text-align: left;
  }
  .input-group label {
    display: block;
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #58a6ff; }

  .divider {
    margin: 16px 0;
    border-bottom: 1px solid #21262d;
    position: relative;
  }
  .divider span {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #161b22;
    padding: 0 8px;
    color: #484f58;
    font-size: 12px;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: #238636; color: #fff; }
  .btn-primary:hover { background: #2ea44f; }
  .btn-secondary { background: #1f6feb; color: #fff; }
  .btn-secondary:hover { background: #388bfd; }
  .btn-cancel { background: #21262d; color: #c9d1d9; margin-top: 10px; }
  .btn-cancel:hover { background: #30363d; }

  #roomCodeDisplay {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #58a6ff;
    margin: 12px 0;
    background: #0d1117;
    padding: 10px;
    border-radius: 6px;
    border: 1px dashed #30363d;
  }

  .status-msg {
    margin-top: 12px;
    font-size: 13px;
    color: #e3b341;
    min-height: 18px;
  }

  /* GRA & HUD */
  #gameWrapper { display: none; text-align: center; }

  #hud {
    width: 800px;
    max-width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-bottom: none;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-board {
    font-size: 22px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .team-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p1-color { color: #58a6ff; }
  .p2-color { color: #f85149; }

  canvas {
    background: #111827;
    border: 1px solid #30363d;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    display: block;
  }

  .controls-bar {
    margin-top: 12px;
    color: #8b949e;
    font-size: 13px;
  }
  .controls-bar span {
    background: #161b22;
    border: 1px solid #30363d;
    padding: 2px 6px;
    border-radius: 4px;
    color: #c9d1d9;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>PONG MULTIPLAYER</h1>
  <p>Odbijaj piłkę platformą i zdobądź punkty!</p>
</div>

<!-- MENU POKOJU -->
<div id="menu">
  <div class="panel" id="mainPanel">
    <div class="input-group">
      <label>TWÓJ NICK</label>
      <input id="nickInput" maxlength="12" placeholder="Gracz 1" value="Gracz">
    </div>
    
    <button class="btn-primary" onclick="createRoom()">Stwórz Pokój (Lewa strona)</button>
    
    <div class="divider"><span>LUB</span></div>
    
    <div class="input-group">
      <label>KOD POKOJU</label>
      <input id="joinInput" maxlength="6" placeholder="np. ABC123" style="text-transform:uppercase;">
    </div>
    <button class="btn-secondary" onclick="joinRoom()">Dołącz (Prawa strona)</button>
    
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="panel hidden" id="waitPanel">
    <div style="font-size:14px; color:#8b949e;">Twój kod pokoju:</div>
    <div id="roomCodeDisplay">------</div>
    <div class="status-msg">Oczekiwanie na drugiego gracza...</div>
    <button class="btn-cancel" onclick="location.reload()">Anuluj</button>
  </div>
</div>

<!-- OBSZAR GRY -->
<div id="gameWrapper">
  <div id="hud">
    <div class="score-board" style="width: 100%; justify-content: space-between;">
      <span class="team-name p1-color" id="hudP1">Gracz 1</span>
      <span id="hudScore" style="background:#0d1117; padding:4px 16px; border-radius:6px; border: 1px solid #30363d;">0 : 0</span>
      <span class="team-name p2-color" id="hudP2">Gracz 2</span>
    </div>
  </div>

  <canvas id="stage" width="800" height="500"></canvas>

  <div class="controls-bar">
    Sterowanie platformą: <span>W</span> / <span>S</span> lub <span>Strzałka w górę</span> / <span>Strzałka w dół</span>
  </div>
</div>

<script>
const W = 800, H = 500;
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

let peer = null, conn = null, isHost = false;
let myName = 'Gracz', oppName = 'Przeciwnik';
let gameActive = false;
let keys = {};

// Paletki graczy
const PADDLE_W = 14, PADDLE_H = 90;
const P1 = { x: 20, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H, speed: 6, score: 0 };
const P2 = { x: W - 20 - PADDLE_W, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H, speed: 6, score: 0 };

// Piłka
const BALL = { x: W/2, y: H/2, r: 8, vx: 5, vy: 3, speed: 5.5 };

const genCode = () => Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*30)]).join('');
function setStatus(txt) { document.getElementById('statusMsg').textContent = txt; }

/* --- SIEC MULTIPLAYER --- */
function createRoom() {
  myName = document.getElementById('nickInput').value.trim() || 'Gracz 1';
  setStatus('Tworzenie pokoju...');
  const code = genCode();
  peer = new Peer('pong-' + code);
  isHost = true;

  peer.on('open', () => {
    document.getElementById('mainPanel').classList.add('hidden');
    document.getElementById('waitPanel').classList.remove('hidden');
    document.getElementById('roomCodeDisplay').textContent = code;
  });

  peer.on('connection', c => {
    conn = c;
    bindConnEvents();
    c.on('open', () => conn.send({ t: 'hello', name: myName }));
  });

  peer.on('error', err => setStatus('Błąd: ' + err.type));
}

function joinRoom() {
  myName = document.getElementById('nickInput').value.trim() || 'Gracz 2';
  const code = document.getElementById('joinInput').value.trim().toUpperCase();
  if (code.length !== 6) { setStatus('Wpisz kod!'); return; }
  
  setStatus('Łączenie...');
  peer = new Peer();
  isHost = false;

  peer.on('open', () => {
    conn = peer.connect('pong-' + code);
    bindConnEvents();
    conn.on('open', () => conn.send({ t: 'hello', name: myName }));
  });

  peer.on('error', () => setStatus('Nie odnaleziono pokoju!'));
}

function bindConnEvents() {
  conn.on('data', handleData);
  conn.on('close', () => { if (gameActive) alert('Przeciwnik rozłączył się.'); location.reload(); });
}

function handleData(d) {
  if (d.t === 'hello') {
    oppName = d.name;
    if (isHost) {
      conn.send({ t: 'start', opp: myName });
      startGame();
    }
  }
  else if (d.t === 'start') {
    oppName = d.opp;
    startGame();
  }
  else if (d.t === 'sync') {
    if (isHost) {
      P2.y = d.py;
    } else {
      P1.y = d.py;
      BALL.x = d.bx; BALL.y = d.by;
      P1.score = d.s1; P2.score = d.s2;
      updateHudScore();
    }
  }
}

function startGame() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameWrapper').style.display = 'block';

  document.getElementById('hudP1').textContent = isHost ? myName : oppName;
  document.getElementById('hudP2').textContent = isHost ? oppName : myName;

  gameActive = true;
  resetBall();
  requestAnimationFrame(gameLoop);
}

function resetBall() {
  BALL.x = W / 2;
  BALL.y = H / 2;
  BALL.speed = 5.5;
  const angle = (Math.random() * Math.PI / 4) - Math.PI / 8;
  const dir = Math.random() < 0.5 ? 1 : -1;
  BALL.vx = dir * BALL.speed * Math.cos(angle);
  BALL.vy = BALL.speed * Math.sin(angle);
}

function updateHudScore() {
  document.getElementById('hudScore').textContent = `${P1.score} : ${P2.score}`;
}

/* --- FIZYKA GRY --- */
function update() {
  // Poruszanie własną paletką
  const myPaddle = isHost ? P1 : P2;
  if (keys['KeyW'] || keys['ArrowUp']) myPaddle.y -= myPaddle.speed;
  if (keys['KeyS'] || keys['ArrowDown']) myPaddle.y += myPaddle.speed;

  // Granice dla paletek
  P1.y = Math.max(10, Math.min(H - P1.h - 10, P1.y));
  P2.y = Math.max(10, Math.min(H - P2.h - 10, P2.y));

  // Logika pilki na hoście (Gospodarzu)
  if (isHost) {
    BALL.x += BALL.vx;
    BALL.y += BALL.vy;

    // Odbicie od góry i dołu
    if (BALL.y - BALL.r <= 0) { BALL.y = BALL.r; BALL.vy *= -1; }
    if (BALL.y + BALL.r >= H) { BALL.y = H - BALL.r; BALL.vy *= -1; }

    // Kolizja z paletką Lewą (P1)
    if (BALL.x - BALL.r <= P1.x + P1.w && BALL.x + BALL.r >= P1.x) {
      if (BALL.y >= P1.y && BALL.y <= P1.y + P1.h) {
        BALL.x = P1.x + P1.w + BALL.r;
        let collidePoint = (BALL.y - (P1.y + P1.h / 2)) / (P1.h / 2);
        let angle = collidePoint * (Math.PI / 3);
        BALL.speed = Math.min(BALL.speed + 0.3, 12);
        BALL.vx = BALL.speed * Math.cos(angle);
        BALL.vy = BALL.speed * Math.sin(angle);
      }
    }

    // Kolizja z paletką Prawą (P2)
    if (BALL.x + BALL.r >= P2.x && BALL.x - BALL.r <= P2.x + P2.w) {
      if (BALL.y >= P2.y && BALL.y <= P2.y + P2.h) {
        BALL.x = P2.x - BALL.r;
        let collidePoint = (BALL.y - (P2.y + P2.h / 2)) / (P2.h / 2);
        let angle = collidePoint * (Math.PI / 3);
        BALL.speed = Math.min(BALL.speed + 0.3, 12);
        BALL.vx = -BALL.speed * Math.cos(angle);
        BALL.vy = BALL.speed * Math.sin(angle);
      }
    }

    // Punkty
    if (BALL.x < 0) {
      P2.score++;
      updateHudScore();
      resetBall();
    } else if (BALL.x > W) {
      P1.score++;
      updateHudScore();
      resetBall();
    }
  }

  // Wysłanie danych do drugiego gracza
  if (conn && conn.open) {
    if (isHost) {
      conn.send({ t: 'sync', py: P1.y, bx: BALL.x, by: BALL.y, s1: P1.score, s2: P2.score });
    } else {
      conn.send({ t: 'sync', py: P2.y });
    }
  }
}

/* --- RENDEROWANIE --- */
function render() {
  // Tło
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, W, H);

  // Linia środkowa
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.strokeStyle = '#374151';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);

  // Paletki
  ctx.fillStyle = '#58a6ff';
  ctx.fillRect(P1.x, P1.y, P1.w, P1.h);

  ctx.fillStyle = '#f85149';
  ctx.fillRect(P2.x, P2.y, P2.w, P2.h);

  // Piłka
  ctx.beginPath();
  ctx.arc(BALL.x, BALL.y, BALL.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function gameLoop() {
  if (!gameActive) return;
  update();
  render();
  requestAnimationFrame(gameLoop);
}

addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
</script>
</body>
</html>
