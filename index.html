<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOVA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 42 13.5v21L24 45 6 34.5v-21z' fill='%230a0b10' stroke='%236ee7f9' stroke-width='3' stroke-linejoin='round'/%3E%3Crect x='14' y='14' width='5' height='20' rx='2.5' fill='%236ee7f9'/%3E%3Crect x='29' y='14' width='5' height='20' rx='2.5' fill='%23f472b6'/%3E%3Cpath d='M18 16 30 32' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b10;
    --surface: rgba(255, 255, 255, 0.035);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f4f5f9;
    --muted: #8d92a3;
    --accent: #6ee7f9;
    --radius: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { overflow-x: hidden; }

  /* ---------- TŁO ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.38;
    animation: float 22s ease-in-out infinite;
  }
  .blob.b1 { width: 520px; height: 520px; background: #4f46e5; top: -180px; left: -120px; }
  .blob.b2 { width: 460px; height: 460px; background: #06b6d4; bottom: -200px; right: -100px; animation-delay: -8s; }
  .blob.b3 { width: 340px; height: 340px; background: #ec4899; top: 40%; left: 55%; opacity: 0.18; animation-delay: -14s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.08); }
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }

  /* ---------- UKŁAD ---------- */
  .app {
    position: relative; z-index: 1;
    max-width: 1120px; margin: 0 auto;
    min-height: 100%; padding: 40px 28px 32px;
    display: flex; flex-direction: column; gap: 36px;
  }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 54px; height: 54px; display: grid; place-items: center;
    filter: drop-shadow(0 6px 22px rgba(110, 231, 249, 0.35));
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .brand:hover .brand-mark { transform: rotate(-6deg) scale(1.06); }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-name {
    font-size: 26px; letter-spacing: 5px; line-height: 1.1;
    background: linear-gradient(90deg, #6ee7f9, #a78bfa 60%, #f472b6);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.3px;
  }
  .brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .search {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 0 14px; height: 42px; min-width: 210px;
    transition: border-color .2s, background .2s;
  }
  .search:focus-within { border-color: var(--border-strong); background: var(--surface-hover); }
  .search svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
  .search input {
    background: none; border: none; outline: none; color: var(--text);
    font: 500 14px 'Inter', sans-serif; width: 100%;
  }
  .search input::placeholder { color: var(--muted); }

  /* ---------- HERO ---------- */
  .hero h2 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(30px, 5vw, 46px); letter-spacing: -1.2px; line-height: 1.08;
  }
  .hero h2 span {
    background: linear-gradient(90deg, #6ee7f9, #a78bfa 55%, #f472b6);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* ---------- KARTY ---------- */
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  }

  .card {
    --c: #6ee7f9;
    position: relative; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; display: flex; flex-direction: column; gap: 22px;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s, background .3s, box-shadow .3s;
    animation: rise .5s both cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(420px circle at 85% -10%, color-mix(in srgb, var(--c) 22%, transparent), transparent 60%);
    opacity: .55; transition: opacity .3s;
  }
  .card.ready { cursor: pointer; }
  .card.ready:hover {
    transform: translateY(-5px); background: var(--surface-hover);
    border-color: color-mix(in srgb, var(--c) 55%, transparent);
    box-shadow: 0 18px 46px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--c) 18%, transparent);
  }
  .card.ready:hover::before { opacity: 1; }
  .card.wip { opacity: .62; }

  .cover {
    position: relative; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden;
    display: grid; place-items: center; color: var(--c);
    background:
      radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--c) 35%, transparent), transparent 65%),
      linear-gradient(145deg, color-mix(in srgb, var(--c) 18%, #0d0f17), #0d0f17);
    border: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
  }
  .cover::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(color-mix(in srgb, var(--c) 14%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, transparent) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at center, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, #000 10%, transparent 75%);
  }
  .cover .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .card.ready:hover .cover .art { transform: scale(1.06); }
  .cover.has-art::before { display: none; }
  
  .card.wip .cover .art { 
    filter: grayscale(0.7) brightness(0.35) blur(6px); 
    transform: scale(1.08); 
  }
  
  .lock { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
  .lock span {
    width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: rgba(10,11,16,.65); border: 1px solid var(--border-strong);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .lock svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .icon-big {
    position: relative; width: 84px; height: 84px; border-radius: 26px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 16%, rgba(10,11,16,.6));
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: 0 0 40px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 22px color-mix(in srgb, var(--c) 18%, transparent);
  }
  .icon-big svg {
    width: 46px; height: 46px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 8px var(--c));
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted);
  }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; }
  .badge.ready { color: #86efac; border-color: rgba(134,239,172,.25); background: rgba(134,239,172,.08); }
  .badge.ready i { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

  .card-body { position: relative; flex: 1; }
  .game-title { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    font-size: 11.5px; font-weight: 500; color: var(--muted);
    padding: 3px 9px; border-radius: 8px; background: rgba(255,255,255,.045);
  }

  .btn {
    position: relative; width: 100%; height: 46px; border: none; border-radius: 14px;
    font: 600 14px 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: transform .2s, filter .2s, background .2s;
  }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn svg.solid { fill: currentColor; stroke: currentColor; stroke-width: 1; }
  .btn.ready { background: var(--c); color: #0a0b10; cursor: pointer; }
  .card.ready:hover .btn.ready { filter: brightness(1.08); }
  .btn.ready:active { transform: scale(.98); }
  .btn.wip { background: rgba(255,255,255,.03); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; }

  .card.wip .card-body { display: none; }
  .card.wip .btn { background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: transparent; }

  .empty {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted);
    border: 1px dashed var(--border-strong); border-radius: var(--radius);
  }
  .empty svg { width: 34px; height: 34px; margin-bottom: 12px; stroke: currentColor; fill: none; stroke-width: 1.5; }

  /* ---------- STOPKA ---------- */
  footer {
    margin-top: auto; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding-top: 22px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted);
  }

  /* ---------- EKRAN GRY ---------- */
  #stage { display: none; position: fixed; inset: 0; z-index: 500; background: #000; }
  #stage.open { display: block; animation: fade .25s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #gameFrame { width: 100%; height: 100%; border: none; display: block; }

  .back {
    position: fixed; top: 14px; left: 14px; z-index: 600;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    height: 40px; padding: 0 15px 0 11px; border-radius: 13px;
    background: rgba(14, 16, 24, 0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border-strong); color: var(--text);
    font: 600 13px 'Inter', sans-serif; transition: background .2s, transform .2s;
  }
  .back:hover { background: rgba(30, 34, 50, 0.9); transform: translateX(-2px); }
  .back svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- PANEL ADMINA ---------- */
  #adminPanel{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  #adminPanel.open{display:flex;animation:fade .18s both}
  .admin-box{width:min(620px,100%);max-height:min(760px,calc(100vh - 48px));overflow:auto;background:#0e1018;border:1px solid var(--border-strong);border-radius:22px;box-shadow:0 28px 90px rgba(0,0,0,.6);padding:24px}
  .admin-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.admin-head h3{font:700 22px 'Space Grotesk',sans-serif}.admin-head p{margin-top:5px;color:var(--muted);font-size:12px}
  .admin-close{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:20px}
  .admin-form{display:grid;gap:13px}.admin-form label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
  .admin-form input,.admin-form select{width:100%;height:43px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.045);color:var(--text);outline:none;font:500 13px 'Inter',sans-serif}
  .admin-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-actions{display:flex;gap:10px;margin-top:5px}
  .admin-actions button{height:43px;padding:0 16px;border-radius:11px;border:1px solid var(--border);cursor:pointer;font:600 13px 'Inter',sans-serif}
  .admin-save{background:var(--accent);color:#071016;border-color:transparent!important;flex:1}.admin-cancel{background:rgba(255,255,255,.05);color:var(--text)}
  .admin-list{margin-top:22px;border-top:1px solid var(--border);padding-top:18px}.admin-list h4{font:600 13px 'Inter',sans-serif;margin-bottom:10px}
  .admin-game{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .admin-game small{color:var(--muted);display:block;margin-top:3px}.admin-delete{border:1px solid rgba(244,114,182,.25);background:rgba(244,114,182,.08);color:#f9a8d4;border-radius:9px;padding:7px 10px;cursor:pointer}
  .admin-note{margin-top:13px;color:var(--muted);font-size:11px;line-height:1.45}
  @media(max-width:640px){.admin-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app" id="hubView">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7f9"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
            <linearGradient id="lg-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141830"/><stop offset="1" stop-color="#0a0b14"/></linearGradient>
          </defs>
          <path d="M24 2.5 42.5 13.2v21.6L24 45.5 5.5 34.8V13.2z" fill="url(#lg-fill)" stroke="url(#lg-ring)" stroke-width="2.6" stroke-linejoin="round"/>
          <rect x="14" y="14.5" width="5" height="19" rx="2.5" fill="#6ee7f9"/>
          <rect x="29" y="14.5" width="5" height="19" rx="2.5" fill="#f472b6"/>
          <path d="M18 17 30 31" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 4"/>
          <circle cx="24" cy="24" r="3.2" fill="#fff"/>
          <circle cx="24" cy="24" r="6" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">NOVA</div>
        <div class="brand-sub">Twoje centrum gier</div>
      </div>
    </div>

    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="searchInput" placeholder="Szukaj gry…" autocomplete="off">
      </label>
    </div>
  </header>

  <section class="hero">
    <h2>Wybierz grę i <span>zacznij grać</span></h2>
  </section>

  <main class="grid" id="gamesGrid"></main>

  <footer>
    <span id="gamesCountLabel"></span>
    <span>NOVA v1.0</span>
  </footer>
</div>

<div id="stage">
  <button type="button" class="back" onclick="closeGame()">
    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg> Hub
  </button>
  <iframe id="gameFrame" src="about:blank" allow="autoplay; fullscreen"></iframe>
</div>

<div id="adminPanel" aria-hidden="true">
  <div class="admin-box" role="dialog" aria-modal="true">
    <div class="admin-head"><div><h3>Panel gier</h3><p>Dodawaj i usuwaj gry bez edytowania kodu.</p></div><button type="button" class="admin-close" id="adminClose">×</button></div>
    <form class="admin-form" id="gameForm">
      <label>Nazwa gry<input id="adminTitleInput" required placeholder="np. Kaczki"></label>
      <label>Plik / URL gry<input id="adminUrlInput" required placeholder="np. kaczki.html"></label>
      <div class="admin-row">
        <label>Status<select id="adminStatusInput"><option value="ready">Gotowa</option><option value="wip">Ukryta / w przygotowaniu</option></select></label>
        <label>Kolor<input id="adminColorInput" value="#f59e0b" placeholder="#f59e0b"></label>
      </div>
      <label>Ikona<select id="adminIconInput"><option value="ducks">Kaczki</option><option value="soccer">FC 28 / Piłka</option><option value="pong">Pong</option><option value="racing">Racing</option><option value="shooter">Shooter</option><option value="tanks">Tanks</option><option value="puzzle">Puzzle</option></select></label>
      <label>Kategorie / tagi<input id="adminTagsInput" placeholder="np. Arcade, Kaczki, Multiplayer"></label>
      <label>Okładka (opcjonalnie)<input id="adminImageInput" placeholder="np. covers/kaczki.png"></label>
      <div class="admin-actions"><button type="button" class="admin-cancel" id="adminCancel">Anuluj</button><button type="submit" class="admin-save">Dodaj grę</button></div>
    </form>
    <div class="admin-list"><h4>Aktualne gry</h4><div id="adminGamesList"></div></div>
    <div class="admin-note">Skrót: <b>F2</b>. Gry zapisują się lokalnie w tej przeglądarce.</div>
  </div>
</div>

<script>
const DEFAULT_GAMES = [
  { title: 'Ping Pong', url: 'pingpong.html', status: 'ready', tags: ['Sport', 'Multiplayer P2P', 'vs AI'], color: '#22d3ee', icon: 'pong' },
  { title: 'FC 28', url: 'fc28.html', status: 'ready', tags: ['Sport', 'Piłka Nożna', 'vs AI'], color: '#10b981', icon: 'soccer' },
  { title: 'Kaczki', url: 'kaczki.html', status: 'ready', tags: ['Zręcznościowa', 'Kaczki', 'Multiplayer P2P'], color: '#f59e0b', icon: 'ducks' },
  { title: 'Astro Strike', url: 'astrostrike.html', status: 'wip', tags: ['Shmup', 'Co-op'], color: '#a78bfa', icon: 'shooter' },
  { title: 'Cyber Tanks', url: 'cybertanks.html', status: 'wip', tags: ['Arena', 'PvP'], color: '#fbbf24', icon: 'tanks' }
];

let storedGames = null;
try { storedGames = JSON.parse(localStorage.getItem('novaGames') || 'null'); } catch (_) {}
let GAMES = Array.isArray(storedGames) && storedGames.length ? storedGames : DEFAULT_GAMES.slice();

GAMES = GAMES.filter(g => g && g.url !== 'cyberpong.html');

// Zapewnij, że Ping Pong jest na pierwszym miejscu
if (!GAMES.some(g => g && g.url === 'pingpong.html')) {
  GAMES.unshift(DEFAULT_GAMES[0]);
}

// Zapewnij, że FC 28 trafia na drugi kafelek
const fcIndex = GAMES.findIndex(g => g && (g.title === 'FC 28' || g.url === 'fc28.html'));
if (fcIndex === -1) {
  if (GAMES.length >= 2) {
    GAMES.splice(1, 0, DEFAULT_GAMES[1]);
  } else {
    GAMES.push(DEFAULT_GAMES[1]);
  }
} else if (fcIndex !== 1) {
  const [fcGame] = GAMES.splice(fcIndex, 1);
  GAMES.splice(1, 0, fcGame);
}

// Zapewnij, że Kaczki trafiają na trzeci kafelek
const ducksIndex = GAMES.findIndex(g => g && (g.title === 'Kaczki' || g.url === 'kaczki.html'));
if (ducksIndex === -1) {
  if (GAMES.length >= 2) {
    GAMES.splice(2, 0, DEFAULT_GAMES[2]);
  } else {
    GAMES.push(DEFAULT_GAMES[2]);
  }
} else if (ducksIndex !== 2) {
  const [ducksGame] = GAMES.splice(ducksIndex, 1);
  GAMES.splice(2, 0, ducksGame);
}

function saveGames() {
  localStorage.setItem('novaGames', JSON.stringify(GAMES));
}

const ICONS = {

const PLAY_ICON = `<svg class="solid" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" stroke-linejoin="round"/></svg>`;
const LOCK_ICON = `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
const EMPTY_ICON = `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;

let currentQuery = '';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderGames() {
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';

  const q = currentQuery.trim().toLowerCase();
  const list = GAMES.filter(g => {
    const okQuery = !q || (g.status === 'ready' && (g.title.toLowerCase().includes(q) || (g.tags || []).some(t => t.toLowerCase().includes(q))));
    return okQuery;
  });

  if (!list.length) {
    grid.innerHTML = `<div class="empty">${EMPTY_ICON}<div>Nic nie znaleziono</div></div>`;
  }

  list.forEach((game, i) => {
    const ready = game.status === 'ready';
    const art = game.image ? `<img class="art" src="${esc(game.image)}" alt="">` : COVERS[game.icon];
    const card = document.createElement('div');
    card.className = `card ${ready ? 'ready' : 'wip'}`;
    card.style.setProperty('--c', game.color || '#6ee7f9');
    card.style.animationDelay = `${i * 60}ms`;

    card.innerHTML = ready ? `
      <div class="cover ${art ? 'has-art' : ''}">
        ${art || `<div class="icon-big">${ICONS[game.icon] || ICONS.pong}</div>`}
        <span class="badge ready"><i></i>Dostępna</span>
      </div>
      <div class="card-body">
        <div class="game-title">${esc(game.title)}</div>
        <div class="tags">${(game.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      </div>
      <button type="button" class="btn ready">${PLAY_ICON}Uruchom</button>` : `
      <div class="cover ${art ? 'has-art' : ''}">
        ${art || `<div class="icon-big">${ICONS[game.icon] || ICONS.pong}</div>`}
        <div class="lock"><span>${LOCK_ICON}</span></div>
      </div>
      <div class="card-body"></div>
      <button type="button" class="btn wip" disabled></button>`;

    if (ready) card.addEventListener('click', () => launchGame(game.url));
    grid.appendChild(card);
  });

  const readyCount = GAMES.filter(g => g.status === 'ready').length;
  document.getElementById('gamesCountLabel').textContent = `Dostępne: ${readyCount}`;
}

document.getElementById('searchInput').addEventListener('input', e => {
  currentQuery = e.target.value;
  renderGames();
});

function launchGame(url) {
  const frame = document.getElementById('gameFrame');
  frame.src = url;
  document.getElementById('stage').classList.add('open');
  frame.focus();
}

function closeGame() {
  document.getElementById('gameFrame').src = 'about:blank';
  document.getElementById('stage').classList.remove('open');
}

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('stage').classList.contains('open')) closeGame();
});

/* ---------- PANEL ADMINA ---------- */
const adminPanel = document.getElementById('adminPanel');
const gameForm = document.getElementById('gameForm');
function openAdmin() { adminPanel.classList.add('open'); adminPanel.setAttribute('aria-hidden', 'false'); renderAdminGames(); setTimeout(() => document.getElementById('adminTitleInput').focus(), 30); }
function closeAdmin() { adminPanel.classList.remove('open'); adminPanel.setAttribute('aria-hidden', 'true'); }
function renderAdminGames() {
  const list = document.getElementById('adminGamesList');
  list.innerHTML = GAMES.map((g, i) => `<div class="admin-game"><div><b>${esc(g.title||'(bez nazwy)')}</b><small>${esc(g.url)} · ${g.status==='ready'?'gotowa':'ukryta'}</small></div><button type="button" class="admin-delete" data-index="${i}">Usuń</button></div>`).join('');
  list.querySelectorAll('.admin-delete').forEach(btn => btn.addEventListener('click', () => { GAMES.splice(Number(btn.dataset.index), 1); saveGames(); renderGames(); renderAdminGames(); }));
}
gameForm.addEventListener('submit', e => {
  e.preventDefault();
  const game = {
    title: document.getElementById('adminTitleInput').value.trim(),
    url: document.getElementById('adminUrlInput').value.trim(),
    status: document.getElementById('adminStatusInput').value,
    color: document.getElementById('adminColorInput').value.trim() || '#6ee7f9',
    icon: document.getElementById('adminIconInput').value,
    tags: document.getElementById('adminTagsInput').value.split(',').map(s => s.trim()).filter(Boolean)
  };
  const image = document.getElementById('adminImageInput').value.trim();
  if (image) game.image = image;
  GAMES.push(game); saveGames(); renderGames(); renderAdminGames(); gameForm.reset();
  document.getElementById('adminColorInput').value = '#f59e0b';
  document.getElementById('adminIconInput').value = 'ducks';
});
document.getElementById('adminClose').addEventListener('click', closeAdmin);
document.getElementById('adminCancel').addEventListener('click', closeAdmin);
adminPanel.addEventListener('click', e => { if (e.target === adminPanel) closeAdmin(); });
window.addEventListener('keydown', e => {
  if (e.key === 'F2') {
    e.preventDefault();
    adminPanel.classList.contains('open') ? closeAdmin() : openAdmin();
    return;
  }
  if (e.key === 'Escape') {
    if (adminPanel.classList.contains('open')) closeAdmin();
  }
});

saveGames();
renderGames();
</script>
