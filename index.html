<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Multiplayer 2D - Enhanced Edition</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }

  body {
    background-color: #0b0f19;
    color: #f0f6fc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #00f0ff;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
  }
  .header p {
    color: #8b949e;
    font-size: 14px;
    margin-top: 4px;
  }

  .panel {
    background: #161b26;
    border: 1px solid #2d3548;
    border-radius: 12px;
    padding: 28px;
    width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    text-align: center;
  }

  .input-group {
    margin-bottom: 14px;
    text-align: left;
  }
  .input-group label {
    display: block;
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    background: #0b0f19;
    border: 1px solid #2d3548;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #00f0ff; }

  .divider {
    margin: 16px 0;
    border-bottom: 1px solid #21262d;
    position: relative;
  }
  .divider span {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #161b26;
    padding: 0 8px;
    color: #484f58;
    font-size: 12px;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: #238636; color: #fff; }
  .btn-primary:hover { background: #2ea44f; }
  .btn-secondary { background: #1f6feb; color: #fff; }
  .btn-secondary:hover { background: #388bfd; }
  .btn-cancel { background: #21262d; color: #c9d1d9; margin-top: 10px; }
  .btn-cancel:hover { background: #30363d; }

  #roomCodeDisplay {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #00f0ff;
    margin: 12px 0;
    background: #0b0f19;
    padding: 10px;
    border-radius: 6px;
    border: 1px dashed #2d3548;
  }

  .status-msg {
    margin-top: 12px;
    font-size: 13px;
    color: #e3b341;
    min-height: 18px;
  }

  #gameWrapper { display: none; text-align: center; position: relative; }

  #hud {
    width: 850px;
    max-width: 100%;
    background: #161b26;
    border: 1px solid #2d3548;
    border-bottom: none;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-board {
    font-size: 24px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .team-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p1-color { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
  .p2-color { color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }

  .canvas-container {
    position: relative;
    width: 850px;
    max-width: 100%;
  }

  canvas {
    background: #0d121d;
    border: 1px solid #2d3548;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    display: block;
  }

  /* Znak wodny z numerem wersji */
  .version-watermark {
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 11px;
    font-family: monospace;
    color: rgba(255, 255, 255, 0.18);
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  .controls-bar {
    margin-top: 12px;
    color: #8b949e;
    font-size: 13px;
  }
  .controls-bar span {
    background: #161b26;
    border: 1px solid #2d3548;
    padding: 2px 6px;
    border-radius: 4px;
    color: #c9d1d9;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>PONG MULTIPLAYER</h1>
  <p>Płynna fizyka, podkręcenia i mechanika Dash</p>
</div>

<!-- MENU POKOJU -->
<div id="menu">
  <div class="panel" id="mainPanel">
    <div class="input-group">
      <label>TWÓJ NICK</label>
      <input id="nickInput" maxlength="12" placeholder="Gracz 1" value="Gracz">
    </div>
    
    <button class="btn-primary" onclick="createRoom()">Stwórz Pokój (Lewa strona)</button>
    
    <div class="divider"><span>LUB</span></div>
    
    <div class="input-group">
      <label>KOD POKOJU</label>
      <input id="joinInput" maxlength="6" placeholder="np. ABC123" style="text-transform:uppercase;">
    </div>
    <button class="btn-secondary" onclick="joinRoom()">Dołącz (Prawa strona)</button>
    
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="panel hidden" id="waitPanel">
    <div style="font-size:14px; color:#8b949e;">Twój kod pokoju:</div>
    <div id="roomCodeDisplay">------</div>
    <div class="status-msg">Oczekiwanie na drugiego gracza...</div>
    <button class="btn-cancel" onclick="location.reload()">Anuluj</button>
  </div>
</div>

<!-- OBSZAR GRY -->
<div id="gameWrapper">
  <div id="hud">
    <div class="score-board" style="width: 100%; justify-content: space-between;">
      <span class="team-name p1-color" id="hudP1">Gracz 1</span>
      <span id="hudScore" style="background:#0b0f19; padding:4px 18px; border-radius:6px; border: 1px solid #2d3548;">0 : 0</span>
      <span class="team-name p2-color" id="hudP2">Gracz 2</span>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="stage" width="850" height="500"></canvas>
    <div class="version-watermark">v1.2.0 - Fluid Performance & Physics Update</div>
  </div>

  <div class="controls-bar">
    Ruch: <span>W / S</span> | Zryw (Dash): <span>SHIFT</span> | Mocny Strzał: <span>SPACJA</span> | <i>Ruch paletką w trakcie odbicia podkręca piłkę!</i>
  </div>
</div>

<script>
const W = 850, H = 500;
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

let peer = null, conn = null, isHost = false;
let myName = 'Gracz', oppName = 'Przeciwnik';
let gameActive = false;
let keys = {};

// Paletki
const BASE_H = 85;
const P1 = { x: 25, y: H/2 - BASE_H/2, w: 12, h: BASE_H, vy: 0, speed: 5.5, score: 0, dashCooldown: 0, color: '#00f0ff' };
const P2 = { x: W - 25 - 12, y: H/2 - BASE_H/2, w: 12, h: BASE_H, vy: 0, speed: 5.5, score: 0, dashCooldown: 0, color: '#ff0055' };

// Piłka (Zbalansowana prędkość)
const BALL = { x: W/2, y: H/2, r: 7, vx: 4, vy: 2, spin: 0, speed: 4.5, lastHit: null };

// Cząsteczki
let particles = [];

const genCode = () => Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*30)]).join('');
function setStatus(txt) { document.getElementById('statusMsg').textContent = txt; }

/* --- SIEC MULTIPLAYER --- */
function createRoom() {
  myName = document.getElementById('nickInput').value.trim() || 'Gracz 1';
  setStatus('Tworzenie pokoju...');
  const code = genCode();
  peer = new Peer('pong-' + code);
  isHost = true;

  peer.on('open', () => {
    document.getElementById('mainPanel').classList.add('hidden');
    document.getElementById('waitPanel').classList.remove('hidden');
    document.getElementById('roomCodeDisplay').textContent = code;
  });

  peer.on('connection', c => {
    conn = c;
    bindConnEvents();
    c.on('open', () => conn.send({ t: 'hello', name: myName }));
  });

  peer.on('error', err => setStatus('Błąd: ' + err.type));
}

function joinRoom() {
  myName = document.getElementById('nickInput').value.trim() || 'Gracz 2';
  const code = document.getElementById('joinInput').value.trim().toUpperCase();
  if (code.length !== 6) { setStatus('Wpisz kod!'); return; }
  
  setStatus('Łączenie...');
  peer = new Peer();
  isHost = false;

  peer.on('open', () => {
    conn = peer.connect('pong-' + code);
    bindConnEvents();
    conn.on('open', () => conn.send({ t: 'hello', name: myName }));
  });

  peer.on('error', () => setStatus('Nie odnaleziono pokoju!'));
}

function bindConnEvents() {
  conn.on('data', handleData);
  conn.on('close', () => { if (gameActive) alert('Przeciwnik rozłączył się.'); location.reload(); });
}

function handleData(d) {
  if (d.t === 'hello') {
    oppName = d.name;
    if (isHost) {
      conn.send({ t: 'start', opp: myName });
      startGame();
    }
  }
  else if (d.t === 'start') {
    oppName = d.opp;
    startGame();
  }
  else if (d.t === 'sync') {
    if (isHost) {
      P2.y = d.py;
      P2.vy = d.pvy;
    } else {
      P1.y = d.py;
      P1.vy = d.pvy;
      BALL.x = d.bx; BALL.y = d.by;
      P1.score = d.s1; P2.score = d.s2;
      updateHudScore();
    }
  }
}

function startGame() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameWrapper').style.display = 'block';

  document.getElementById('hudP1').textContent = isHost ? myName : oppName;
  document.getElementById('hudP2').textContent = isHost ? oppName : myName;

  gameActive = true;
  resetBall();
  requestAnimationFrame(gameLoop);
}

function resetBall() {
  BALL.x = W / 2;
  BALL.y = H / 2;
  BALL.speed = 4.8;
  BALL.spin = 0;
  BALL.lastHit = null;
  const angle = (Math.random() * Math.PI / 4) - Math.PI / 8;
  const dir = Math.random() < 0.5 ? 1 : -1;
  BALL.vx = dir * BALL.speed * Math.cos(angle);
  BALL.vy = BALL.speed * Math.sin(angle);
}

function createImpactParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 1.0,
      color
    });
  }
}

function updateHudScore() {
  document.getElementById('hudScore').textContent = `${P1.score} : ${P2.score}`;
}

/* --- FIZYKA & UPDATE --- */
function update() {
  const myPaddle = isHost ? P1 : P2;
  
  // Ruch Paletki
  let moveDir = 0;
  if (keys['KeyW'] || keys['ArrowUp']) moveDir -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) moveDir += 1;

  // Dash Mechanika
  if (myPaddle.dashCooldown > 0) myPaddle.dashCooldown--;
  let currentSpeed = myPaddle.speed;
  if ((keys['ShiftLeft'] || keys['ShiftRight']) && myPaddle.dashCooldown === 0 && moveDir !== 0) {
    currentSpeed *= 2.8;
    myPaddle.dashCooldown = 45;
    createImpactParticles(myPaddle.x + myPaddle.w / 2, myPaddle.y + myPaddle.h / 2, myPaddle.color);
  }

  myPaddle.vy = moveDir * currentSpeed;
  myPaddle.y += myPaddle.vy;

  P1.y = Math.max(10, Math.min(H - P1.h - 10, P1.y));
  P2.y = Math.max(10, Math.min(H - P2.h - 10, P2.y));

  // Główna logika (Host)
  if (isHost) {
    // Podkręcenie wpływa na tor lotu piłki
    BALL.vy += BALL.spin * 0.05;
    BALL.spin *= 0.96;

    BALL.x += BALL.vx;
    BALL.y += BALL.vy;

    // Odbicia góra/dół
    if (BALL.y - BALL.r <= 0) {
      BALL.y = BALL.r; BALL.vy *= -1;
      createImpactParticles(BALL.x, BALL.y, '#ffffff');
    }
    if (BALL.y + BALL.r >= H) {
      BALL.y = H - BALL.r; BALL.vy *= -1;
      createImpactParticles(BALL.x, BALL.y, '#ffffff');
    }

    // Odbicie od Lewej Paletki (P1)
    if (BALL.x - BALL.r <= P1.x + P1.w && BALL.x + BALL.r >= P1.x) {
      if (BALL.y >= P1.y && BALL.y <= P1.y + P1.h) {
        BALL.x = P1.x + P1.w + BALL.r;
        BALL.lastHit = P1;

        let collidePoint = (BALL.y - (P1.y + P1.h / 2)) / (P1.h / 2);
        let angle = collidePoint * (Math.PI / 3.5);

        // Mechanika Mocnego Uderzenia (Spacja)
        let isPowerHit = keys['Space'];
        let boost = isPowerHit ? 0.6 : 0.25;

        BALL.speed = Math.min(BALL.speed + boost, 11);
        BALL.spin = P1.vy * 0.4; // Przekazanie rotacji z paletki

        BALL.vx = BALL.speed * Math.cos(angle);
        BALL.vy = BALL.speed * Math.sin(angle);

        createImpactParticles(BALL.x, BALL.y, P1.color);
      }
    }

    // Odbicie od Prawej Paletki (P2)
    if (BALL.x + BALL.r >= P2.x && BALL.x - BALL.r <= P2.x + P2.w) {
      if (BALL.y >= P2.y && BALL.y <= P2.y + P2.h) {
        BALL.x = P2.x - BALL.r;
        BALL.lastHit = P2;

        let collidePoint = (BALL.y - (P2.y + P2.h / 2)) / (P2.h / 2);
        let angle = collidePoint * (Math.PI / 3.5);

        let isPowerHit = keys['Space'];
        let boost = isPowerHit ? 0.6 : 0.25;

        BALL.speed = Math.min(BALL.speed + boost, 11);
        BALL.spin = P2.vy * 0.4;

        BALL.vx = -BALL.speed * Math.cos(angle);
        BALL.vy = BALL.speed * Math.sin(angle);

        createImpactParticles(BALL.x, BALL.y, P2.color);
      }
    }

    // Punkty
    if (BALL.x < -10) {
      P2.score++;
      updateHudScore();
      resetBall();
    } else if (BALL.x > W + 10) {
      P1.score++;
      updateHudScore();
      resetBall();
    }
  }

  // Aktulizacja Cząsteczek
  particles.forEach((p, index) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Komunikacja P2P
  if (conn && conn.open) {
    if (isHost) {
      conn.send({
        t: 'sync', py: P1.y, pvy: P1.vy,
        bx: BALL.x, by: BALL.y,
        s1: P1.score, s2: P2.score
      });
    } else {
      conn.send({ t: 'sync', py: P2.y, pvy: P2.vy });
    }
  }
}

/* --- RENDER --- */
function render() {
  ctx.fillStyle = '#0d121d';
  ctx.fillRect(0, 0, W, H);

  // Linia Środkowa
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.strokeStyle = '#2d3548';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);

  // Cząsteczki
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1.0;
  });

  // Paletki z Poświatą (Glow)
  ctx.shadowBlur = 10;

  ctx.fillStyle = P1.color;
  ctx.shadowColor = P1.color;
  ctx.fillRect(P1.x, P1.y, P1.w, P1.h);

  ctx.fillStyle = P2.color;
  ctx.shadowColor = P2.color;
  ctx.fillRect(P2.x, P2.y, P2.w, P2.h);

  // Piłka
  ctx.beginPath();
  ctx.arc(BALL.x, BALL.y, BALL.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 12;
  ctx.fill();

  ctx.shadowBlur = 0; // Wyłączenie poświaty
}

function gameLoop() {
  if (!gameActive) return;
  update();
  render();
  requestAnimationFrame(gameLoop);
}

addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
</script>
</body>
</html>
