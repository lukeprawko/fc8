<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC 28 - Piłkarski Multiplayer</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(ellipse at top, #0b3d2e 0%, #06231a 60%, #041710 100%);
    color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:20px;
  }
  h1 {
    font-size:52px; font-style:italic; letter-spacing:2px;
    background:linear-gradient(180deg,#ffe98a,#e8b400);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 20px rgba(0,0,0,.5); margin-bottom:4px;
  }
  .subtitle { color:#9fd8b9; font-size:14px; margin-bottom:20px; letter-spacing:4px; text-transform:uppercase; }
  #menu { text-align:center; }
  .panel {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:16px; padding:26px 30px; backdrop-filter:blur(6px);
    box-shadow:0 10px 40px rgba(0,0,0,.4); min-width:340px;
  }
  input {
    width:100%; padding:12px 14px; margin:8px 0; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.35); color:#fff; font-size:16px; outline:none;
  }
  input:focus { border-color:#ffd54d; }
  button {
    width:100%; padding:13px; margin:6px 0; border:none; border-radius:10px; cursor:pointer;
    font-size:16px; font-weight:bold; transition:transform .1s, box-shadow .1s;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .btn-gold { background:linear-gradient(180deg,#ffd54d,#e8a900); color:#3a2a00; }
  .btn-green { background:linear-gradient(180deg,#35d07f,#1d9d55); color:#fff; }
  .btn-gray { background:rgba(255,255,255,.15); color:#fff; }
  #roomCode { font-size:34px; letter-spacing:8px; font-weight:bold; color:#ffd54d; margin:10px 0; }
  .status { color:#9fd8b9; font-size:14px; min-height:20px; margin-top:8px; }
  #gameArea { display:none; text-align:center; }
  canvas { border-radius:12px; box-shadow:0 15px 50px rgba(0,0,0,.6); max-width:95vw; background:#2a824e; }
  #hud { display:flex; justify-content:space-between; align-items:center; width:960px; max-width:95vw; margin-bottom:8px; }
  .score { font-size:30px; font-weight:bold; }
  .score .p1 { color:#ffd54d; } .score .p2 { color:#6ec6ff; }
  #timer { font-size:24px; background:rgba(0,0,0,.4); padding:4px 18px; border-radius:20px; }
  #controlsInfo { color:#cfe9d8; font-size:13px; margin-top:10px; line-height:1.6; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<h1>FC 28</h1>
<div class="subtitle">Mini Piłka Nożna · Multiplayer + Sprint + Fizyka Brzegów</div>

<!-- MENU -->
<div id="menu">
  <div class="panel" id="menuPanel">
    <input id="nick" maxlength="14" placeholder="Twój pseudonim" value="">
    <button class="btn-gold" onclick="createRoom()">⚽ Załóż pokój</button>
    <div style="margin:12px 0 4px; color:#9fd8b9;">— lub dołącz —</div>
    <input id="joinCode" maxlength="6" placeholder="Kod pokoju (np. K7Q2XA)" style="text-transform:uppercase;">
    <button class="btn-green" onclick="joinRoom()">🎮 Dołącz do gry</button>
    <div class="status" id="status"></div>
  </div>

  <div class="panel hidden" id="roomPanel">
    <div>Podaj znajomemu ten kod pokoju:</div>
    <div id="roomCode">------</div>
    <div class="status">Oczekiwanie na przeciwnika...</div>
    <button class="btn-gray" onclick="location.reload()" style="margin-top:10px;">Anuluj</button>
  </div>
</div>

<!-- GRA -->
<div id="gameArea">
  <div id="hud">
    <div class="score"><span class="p1" id="name1">Ty</span> <span class="p1" id="s1">0</span> : <span class="p2" id="s2">0</span> <span class="p2" id="name2">Przeciwnik</span></div>
    <div id="timer">3:00</div>
  </div>
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="controlsInfo">
    🕹 Ruch: <b>WASD / Strzałki</b> | ⚡ Sprint: <b>SHIFT</b> | 💥 Strzał: <b>SPACJA / J</b> | ⚽ Podanie: <b>K</b> | 🛡 Odbiór / Drybling: <b>E</b>
  </div>
</div>

<script>
/* ================= FC 28 - Silnik z ulepszoną fizyką i sprintem ================= */
const W = 960, H = 540;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const statusEl = document.getElementById('status');
const setStatus = t => statusEl.textContent = t;

const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({length:6}, () => CHARS[Math.floor(Math.random()*CHARS.length)]).join('');

let peer = null, conn = null, isHost = false;
let myName = 'Gracz', oppName = 'Przeciwnik';
let started = false, startTime = 0;
let keys = {};

// --- Parametry Boiska i Bramek ---
const FIELD_MARGIN = 40;
const GOAL_DEPTH = 35;
const GOAL_H = 140; // Wysokość światła bramki
const GOAL_TOP = H/2 - GOAL_H/2;
const GOAL_BOT = H/2 + GOAL_H/2;

// --- Stan Gry ---
const ME   = { x:200, y:H/2, vx:0, vy:0, r:18, faceX:1, faceY:0 };
const OPP  = { x:760, y:H/2, vx:0, vy:0, r:18, faceX:-1, faceY:0 };
const GK1  = { x:FIELD_MARGIN + 15, y:H/2, vx:0, vy:0, r:18, team:1 };
const GK2  = { x:W - FIELD_MARGIN - 15, y:H/2, vx:0, vy:0, r:18, team:2 };
const BALL = { x:W/2, y:H/2, vx:0, vy:0, r:9 };

let score1 = 0, score2 = 0;
let goalFlash = 0, goalText = '';
const MATCH_LEN = 180;

/* ---------- Połączenia (PeerJS) ---------- */
function createRoom() {
  myName = document.getElementById('nick').value.trim() || 'Gospodarz';
  setStatus('Łączenie z serwerem...');
  const code = genCode();
  peer = new Peer('fc28-' + code);
  isHost = true;

  peer.on('open', () => {
    document.getElementById('menuPanel').classList.add('hidden');
    document.getElementById('roomPanel').classList.remove('hidden');
    document.getElementById('roomCode').textContent = code;
  });
  peer.on('connection', c => {
    conn = c;
    setupConn();
    c.on('open', () => conn.send({ t:'hello', name: myName }));
  });
  peer.on('error', e => setStatus('Błąd: ' + e.type));
}

function joinRoom() {
  myName = document.getElementById('nick').value.trim() || 'Gość';
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (code.length !== 6) { setStatus('Wpisz 6-znakowy kod!'); return; }
  setStatus('Łączenie...');
  peer = new Peer();
  isHost = false;

  peer.on('open', () => {
    conn = peer.connect('fc28-' + code, { reliable:true });
    setupConn();
    conn.on('open', () => {
      conn.send({ t:'hello', name: myName });
      setStatus('Połączono! Oczekiwanie na start...');
    });
  });
  peer.on('error', e => setStatus('Nie znaleziono pokoju (' + e.type + ')'));
}

function setupConn() {
  conn.on('data', onData);
  conn.on('close', () => { if (started) alert('Przeciwnik opuścił grę.'); location.reload(); });
}

function onData(d) {
  if (d.t === 'hello') {
    oppName = d.name;
    if (isHost) {
      conn.send({ t:'start', opp: myName, youAre: 2 });
      beginGame(1, d.name);
    }
  }
  else if (d.t === 'start') { beginGame(d.youAre, d.opp); }
  else if (d.t === 's') {
    OPP.x = d.x; OPP.y = d.y; OPP.vx = d.vx; OPP.vy = d.vy;
    if (!isHost) {
      BALL.x = d.bx; BALL.y = d.by; BALL.vx = d.bvx; BALL.vy = d.bvy;
      GK1.x = d.gk1x; GK1.y = d.gk1y; GK2.x = d.gk2x; GK2.y = d.gk2y;
    }
    score1 = d.s1; score2 = d.s2; syncScore();
  }
  else if (d.t === 'goal') { goalText = d.who; goalFlash = 120; resetPositions(d.kickoff); }
}

/* ---------- Start i Wynik ---------- */
function beginGame(myNum, opponentName) {
  oppName = opponentName;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('name1').textContent = isHost ? myName : oppName;
  document.getElementById('name2').textContent = isHost ? oppName : myName;
  started = true;
  startTime = Date.now();
  resetPositions(0);
  requestAnimationFrame(loop);
}

function resetPositions(kickoffDir) {
  ME.x = isHost ? 260 : 700; ME.y = H/2; ME.vx = 0; ME.vy = 0;
  OPP.x = isHost ? 700 : 260; OPP.y = H/2; OPP.vx = 0; OPP.vy = 0;
  GK1.x = FIELD_MARGIN + 15; GK1.y = H/2; GK1.vx = 0; GK1.vy = 0;
  GK2.x = W - FIELD_MARGIN - 15; GK2.y = H/2; GK2.vx = 0; GK2.vy = 0;
  BALL.x = W/2; BALL.y = H/2; BALL.vx = kickoffDir * 3; BALL.vy = 0;
}

function syncScore() {
  document.getElementById('s1').textContent = isHost ? score1 : score2;
  document.getElementById('s2').textContent = isHost ? score2 : score1;
}

/* ---------- Fizyka i Sterowanie (z obsługą SPRINTU) ---------- */
function stepPlayer(p, isMe, dt) {
  // Sprint pod Shiftem przyspiesza gracza
  const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
  const ACC = isSprinting ? 1.0 : 0.65;
  const MAXV = isSprinting ? 8.2 : 5.5;
  const FRICTION = 0.86;

  if (isMe) {
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      p.vx += (dx / len) * ACC;
      p.vy += (dy / len) * ACC;
      p.faceX = dx / len;
      p.faceY = dy / len;
    }
  }

  p.vx *= FRICTION; p.vy *= FRICTION;
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > MAXV) { p.vx = (p.vx / sp) * MAXV; p.vy = (p.vy / sp) * MAXV; }

  p.x += p.vx * dt; p.y += p.vy * dt;

  // Granice boiska dla gracza
  p.x = Math.max(FIELD_MARGIN + p.r, Math.min(W - FIELD_MARGIN - p.r, p.x));
  p.y = Math.max(FIELD_MARGIN + p.r, Math.min(H - FIELD_MARGIN - p.r, p.y));
}

function handleActions(p) {
  const dist = Math.hypot(BALL.x - p.x, BALL.y - p.y);
  
  // 1. STRZAŁ (Spacja lub J)
  if ((keys['Space'] || keys['KeyJ']) && dist < p.r + BALL.r + 12) {
    const power = 14;
    BALL.vx = p.faceX * power + p.vx * 0.4;
    BALL.vy = p.faceY * power + p.vy * 0.4;
  }
  // 2. PODANIE (K)
  else if (keys['KeyK'] && dist < p.r + BALL.r + 14) {
    const power = 8.5;
    BALL.vx = p.faceX * power;
    BALL.vy = p.faceY * power;
  }
  // 3. ODBIÓR / PRZEJĘCIE PIŁKI (E)
  else if (keys['KeyE'] && dist < p.r + BALL.r + 22) {
    p.vx += p.faceX * 3.5; p.vy += p.faceY * 3.5;
    BALL.vx = p.faceX * 11 + (Math.random() - 0.5) * 2;
    BALL.vy = p.faceY * 11 + (Math.random() - 0.5) * 2;
  }
  // 4. DRYBLING / prowadzenie piłki przy graczu
  else if (dist < p.r + BALL.r + 6) {
    const targetX = p.x + p.faceX * (p.r + BALL.r + 2);
    const targetY = p.y + p.faceY * (p.r + BALL.r + 2);
    BALL.x += (targetX - BALL.x) * 0.35;
    BALL.y += (targetY - BALL.y) * 0.35;
    BALL.vx = p.vx; BALL.vy = p.vy;
  }
}

/* ---------- AI Bramkarzy ---------- */
function updateGK(gk, targetX, pAlly, dt) {
  const defY = Math.max(GOAL_TOP + gk.r, Math.min(GOAL_BOT - gk.r, BALL.y));
  let destX = targetX;
  let destY = defY;

  const distToBall = Math.hypot(BALL.x - gk.x, BALL.y - gk.y);
  if (distToBall < 130) {
    destX = BALL.x;
    destY = BALL.y;
  }

  const dx = destX - gk.x;
  const dy = destY - gk.y;
  const dist = Math.hypot(dx, dy);

  if (dist > 2) {
    const speed = distToBall < 130 ? 4.0 : 2.6;
    gk.vx = (dx / dist) * speed;
    gk.vy = (dy / dist) * speed;
  } else {
    gk.vx *= 0.5; gk.vy *= 0.5;
  }

  gk.x += gk.vx * dt;
  gk.y += gk.vy * dt;

  if (distToBall < gk.r + BALL.r + 4) {
    const passTarget = pAlly || { x: W/2, y: H/2 };
    const pdx = passTarget.x - gk.x;
    const pdy = passTarget.y - gk.y;
    const plen = Math.hypot(pdx, pdy) || 1;
    BALL.vx = (pdx / plen) * 9.5;
    BALL.vy = (pdy / plen) * 9.5;
  }
}

/* ---------- Ulepszona Fizyka Odbijania Piłki od Band i Słupków ---------- */
function stepBall(dt) {
  BALL.x += BALL.vx * dt; BALL.y += BALL.vy * dt;
  BALL.vx *= 0.985; BALL.vy *= 0.985; // Tarcie podłoża

  const BOUNCE = 0.8; // Współczynnik sprężystości odbicia

  // Górna i Dolna Banda (Brak możliwości wylecenia poza boisko)
  if (BALL.y < FIELD_MARGIN + BALL.r) {
    BALL.y = FIELD_MARGIN + BALL.r;
    BALL.vy = -BALL.vy * BOUNCE;
  }
  if (BALL.y > H - FIELD_MARGIN - BALL.r) {
    BALL.y = H - FIELD_MARGIN - BALL.r;
    BALL.vy = -BALL.vy * BOUNCE;
  }

  // Lewa i Prawa Ściana/Banda (Z wyjątkiem wpadnięcia do bramki)
  const inGoalY = BALL.y > GOAL_TOP + BALL.r && BALL.y < GOAL_BOT - BALL.r;

  if (!inGoalY) {
    // Lewa Linia Końcowa
    if (BALL.x < FIELD_MARGIN + BALL.r) {
      BALL.x = FIELD_MARGIN + BALL.r;
      BALL.vx = -BALL.vx * BOUNCE;
    }
    // Prawa Linia Końcowa
    if (BALL.x > W - FIELD_MARGIN - BALL.r) {
      BALL.x = W - FIELD_MARGIN - BALL.r;
      BALL.vx = -BALL.vx * BOUNCE;
    }
  } else {
    // Słupki Bramek
    checkPostCollision(FIELD_MARGIN, GOAL_TOP);
    checkPostCollision(FIELD_MARGIN, GOAL_BOT);
    checkPostCollision(W - FIELD_MARGIN, GOAL_TOP);
    checkPostCollision(W - FIELD_MARGIN, GOAL_BOT);

    // Odbicie od tyłu i ścian siatki
    if (BALL.x < FIELD_MARGIN - GOAL_DEPTH + BALL.r) {
      BALL.x = FIELD_MARGIN - GOAL_DEPTH + BALL.r;
      BALL.vx = -BALL.vx * 0.5;
    }
    if (BALL.x > W - FIELD_MARGIN + GOAL_DEPTH - BALL.r) {
      BALL.x = W - FIELD_MARGIN + GOAL_DEPTH - BALL.r;
      BALL.vx = -BALL.vx * 0.5;
    }
  }
}

function checkPostCollision(px, py) {
  const dx = BALL.x - px, dy = BALL.y - py;
  const dist = Math.hypot(dx, dy);
  if (dist < BALL.r + 6) {
    const nx = dx / dist, ny = dy / dist;
    BALL.x = px + nx * (BALL.r + 6);
    BALL.y = py + ny * (BALL.r + 6);
    const dot = BALL.vx * nx + BALL.vy * ny;
    BALL.vx = (BALL.vx - 2 * dot * nx) * 0.8;
    BALL.vy = (BALL.vy - 2 * dot * ny) * 0.8;
  }
}

function collidePlayerBall(p) {
  const dx = BALL.x - p.x, dy = BALL.y - p.y;
  const dist = Math.hypot(dx, dy), minD = p.r + BALL.r;
  if (dist < minD && dist > 0) {
    const nx = dx / dist, ny = dy / dist;
    BALL.x = p.x + nx * minD; BALL.y = p.y + ny * minD;
    BALL.vx = nx * 4.0 + p.vx * 0.6;
    BALL.vy = ny * 4.0 + p.vy * 0.6;
  }
}

/* ---------- Detekcja Gola ---------- */
function checkGoal() {
  if (BALL.y > GOAL_TOP && BALL.y < GOAL_BOT) {
    if (BALL.x < FIELD_MARGIN - BALL.r) {
      if (isHost) { score2++; syncScore(); conn && conn.send({t:'goal', who: oppName + ' STRZELA GOLA!', kickoff: 1}); }
      goalText = '⚽ GOL!'; goalFlash = 120; resetPositions(1);
    }
    else if (BALL.x > W - FIELD_MARGIN + BALL.r) {
      if (isHost) { score1++; syncScore(); conn && conn.send({t:'goal', who: myName + ' STRZELA GOLA!', kickoff: -1}); }
      goalText = '⚽ GOL!'; goalFlash = 120; resetPositions(-1);
    }
  }
}

/* ---------- Główna Pętla Gry ---------- */
let lastT = 0, netTimer = 0;
function loop(ts) {
  if (!started) return;
  const dt = Math.min((ts - lastT) / 16.6, 3) || 1;
  lastT = ts;

  stepPlayer(ME, true, dt);
  handleActions(ME);

  if (isHost) {
    stepBall(dt);
    updateGK(GK1, FIELD_MARGIN + 15, ME, dt);
    updateGK(GK2, W - FIELD_MARGIN - 15, OPP, dt);
    collidePlayerBall(ME);
    collidePlayerBall(OPP);
    checkGoal();
  } else {
    BALL.x += BALL.vx * dt * 0.9; BALL.y += BALL.vy * dt * 0.9;
    collidePlayerBall(ME);
  }

  // Synchronizacja sieciowa
  netTimer++;
  if (netTimer % 3 === 0 && conn && conn.open) {
    if (isHost) {
      conn.send({
        t:'s', x:ME.x, y:ME.y, vx:ME.vx, vy:ME.vy,
        bx:BALL.x, by:BALL.y, bvx:BALL.vx, bvy:BALL.vy,
        gk1x:GK1.x, gk1y:GK1.y, gk2x:GK2.x, gk2y:GK2.y,
        s1:score1, s2:score2
      });
    } else {
      conn.send({ t:'s', x:ME.x, y:ME.y, vx:ME.vx, vy:ME.vy });
    }
  }

  // Czas gry
  const left = Math.max(0, MATCH_LEN - (Date.now() - startTime)/1000);
  const m = Math.floor(left/60), s = Math.floor(left%60);
  document.getElementById('timer').textContent = m + ':' + String(s).padStart(2,'0');
  if (left <= 0) { endMatch(); return; }
  if (goalFlash > 0) goalFlash--;

  draw();
  requestAnimationFrame(loop);
}

function endMatch() {
  started = false;
  const mine = isHost ? score1 : score2, theirs = isHost ? score2 : score1;
  draw();
  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54d'; ctx.font = 'bold 52px Segoe UI';
  ctx.fillText(mine > theirs ? '🏆 WYGRAŁEŚ!' : mine < theirs ? '😢 PRZEGRAŁEŚ' : '🤝 REMIS', W/2, H/2 - 20);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Segoe UI';
  ctx.fillText(score1 + ' : ' + score2, W/2, H/2 + 35);
  ctx.font = '18px Segoe UI'; ctx.fillStyle = '#9fd8b9';
  ctx.fillText('Odśwież stronę, aby zagrać ponownie', W/2, H/2 + 75);
}

/* ---------- Renderowanie Grafiki ---------- */
function draw() {
  // 1. Trawa w pasy
  const numStripes = 12;
  const stripeW = (W - 2 * FIELD_MARGIN) / numStripes;
  for (let i = 0; i < numStripes; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#2a8b4e' : '#319957';
    ctx.fillRect(FIELD_MARGIN + i * stripeW, FIELD_MARGIN, stripeW, H - 2 * FIELD_MARGIN);
  }

  // Bandy wokół boiska (oznaczające fizyczną barierę)
  ctx.strokeStyle = '#e2b04c'; ctx.lineWidth = 6;
  ctx.strokeRect(FIELD_MARGIN - 3, FIELD_MARGIN - 3, W - 2 * FIELD_MARGIN + 6, H - 2 * FIELD_MARGIN + 6);

  // 2. Linie Boiska
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
  ctx.strokeRect(FIELD_MARGIN, FIELD_MARGIN, W - 2 * FIELD_MARGIN, H - 2 * FIELD_MARGIN);
  ctx.beginPath(); ctx.moveTo(W/2, FIELD_MARGIN); ctx.lineTo(W/2, H - FIELD_MARGIN); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2, H/2, 65, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2, H/2, 4, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();

  // Pola karne
  const boxW = 120, boxH = 220;
  ctx.strokeRect(FIELD_MARGIN, H/2 - boxH/2, boxW, boxH);
  ctx.strokeRect(W - FIELD_MARGIN - boxW, H/2 - boxH/2, boxW, boxH);

  // 3. Bramki
  drawGoal(FIELD_MARGIN, true);
  drawGoal(W - FIELD_MARGIN, false);

  // 4. Zawodnicy & AI Bramkarze
  drawPlayer(GK1, '#e74c3c', 'GK (Host)');
  drawPlayer(GK2, '#e74c3c', 'GK (Gość)');
  drawPlayer(OPP, '#6ec6ff', isHost ? oppName : myName);
  drawPlayer(ME, '#ffd54d', myName);

  // 5. Piłka
  ctx.beginPath(); ctx.arc(BALL.x, BALL.y, BALL.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(BALL.x, BALL.y, 3, 0, Math.PI * 2); ctx.fillStyle = '#222'; ctx.fill();

  // 6. Baner Gola
  if (goalFlash > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, H/2 - 50, W, 100);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd54d'; ctx.font = 'bold 46px Segoe UI';
    ctx.fillText(goalText, W/2, H/2 + 15);
  }
}

function drawGoal(x, isLeft) {
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(isLeft ? x - GOAL_DEPTH : x, GOAL_TOP, GOAL_DEPTH, GOAL_H);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.strokeRect(isLeft ? x - GOAL_DEPTH : x, GOAL_TOP, GOAL_DEPTH, GOAL_H);

  // Słupki
  ctx.fillStyle = '#e67e22';
  ctx.beginPath(); ctx.arc(x, GOAL_TOP, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, GOAL_BOT, 6, 0, Math.PI * 2); ctx.fill();
}

function drawPlayer(p, color, name) {
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.stroke();

  // Wskaźnik kierunku
  if (p.faceX || p.faceY) {
    ctx.beginPath();
    ctx.arc(p.x + (p.faceX || 0) * 10, p.y + (p.faceY || 0) * 10, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#222'; ctx.fill();
  }

  // Etykieta
  ctx.font = 'bold 12px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
  ctx.strokeText(name, p.x, p.y - p.r - 7);
  ctx.fillText(name, p.x, p.y - p.r - 7);
}

/* ---------- Obsługa Klawiatury ---------- */
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
</script>
