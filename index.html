<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JDR Games</title>
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
  @property --border-angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }

  :root {
    --bg: #06080e;
    --panel-bg: rgba(14, 18, 28, 0.85);
    --panel-hover: rgba(20, 26, 40, 0.94);
    --panel-border: rgba(255, 255, 255, 0.085);
    --panel-rim: rgba(255, 255, 255, 0.17);
    
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    
    --accent: #f59e0b;
    --accent-bright: #fde047;
    --green: #10b981;
    
    --dynamic-rgb: 245, 158, 11;
    
    --font-heading: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --radius-xl: 20px;
    --radius-lg: 14px;
    --radius-md: 10px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100%;
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- TŁO GRAFICZNE + ŻYWY 3D CYBER TERRAIN ---------- */
  .graphic-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: radial-gradient(circle at 50% -10%, rgba(var(--dynamic-rgb), 0.18) 0%, #06080e 64%);
    transition: background 0.6s ease;
  }

  .graphic-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.8;
  }

  .svg-ring-slow {
    transform-origin: 800px 140px;
    animation: svgSpin 48s linear infinite;
  }

  .svg-ring-rev {
    transform-origin: 800px 140px;
    animation: svgSpinRev 36s linear infinite;
  }

  @keyframes svgSpin {
    to { transform: rotate(360deg); }
  }

  @keyframes svgSpinRev {
    to { transform: rotate(-360deg); }
  }

  #terrainCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .bg-vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(4, 6, 11, 0.88) 100%);
  }

  /* ---------- FALA UDERZENIOWA PRZY KLIKNIĘCIU ---------- */
  .click-ripple {
    position: fixed;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--ripple-color, #f59e0b);
    box-shadow: 0 0 24px var(--ripple-color, #f59e0b);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 400;
    animation: shockwaveExpand 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes shockwaveExpand {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(16); opacity: 0; }
  }

  /* ---------- GŁÓWNY KONTENER ---------- */
  .app {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    padding: 26px 24px 36px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.42s ease, filter 0.42s ease;
  }

  .app.launching {
    transform: scale(1.06);
    opacity: 0;
    filter: blur(14px);
    pointer-events: none;
  }

  /* ---------- SATYNOWE MENU (FLOATING DOCK) ---------- */
  .nav-dock {
    position: sticky;
    top: 16px;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 11px 16px 11px 22px;
    background: rgba(13, 17, 26, 0.85);
    border: 1px solid var(--panel-border);
    border-top-color: var(--panel-rim);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 
      0 18px 40px -12px rgba(0, 0, 0, 0.78),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: dockDrop 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes dockDrop {
    from { opacity: 0; transform: translateY(-20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .nav-dock::after {
    content: "";
    position: absolute;
    top: -1px;
    left: 14%;
    right: 14%;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(var(--dynamic-rgb), 0.9), rgba(255, 255, 255, 0.85), rgba(var(--dynamic-rgb), 0.9), transparent);
    background-size: 200% 100%;
    animation: rimFlow 5s linear infinite;
    pointer-events: none;
  }

  @keyframes rimFlow {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #fff;
    font-family: var(--font-heading);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.6px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .brand:hover {
    transform: scale(1.03);
  }

  .brand-badge {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%);
    color: #07090f;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.8px;
    box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
  }

  .brand-badge::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.65) 50%, transparent 75%);
    transform: translateX(-140%);
    animation: badgeGlint 4.5s ease-in-out infinite;
  }

  @keyframes badgeGlint {
    0%, 70% { transform: translateX(-140%); }
    100% { transform: translateX(140%); }
  }

  .nav-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulseLive 2s infinite;
  }

  @keyframes pulseLive {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.7); opacity: 0.4; }
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .action-btn {
    height: 38px;
    padding: 0 15px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.09);
    color: #fff;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .action-btn svg {
    width: 15px;
    height: 15px;
    color: var(--accent);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .action-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(245, 158, 11, 0.5);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.2);
  }

  .action-btn:hover svg {
    transform: rotate(360deg) scale(1.12);
  }

  .action-btn.rolling {
    pointer-events: none;
    border-color: var(--accent);
    background: rgba(245, 158, 11, 0.16);
  }

  .action-btn.rolling svg {
    animation: spinDice 0.35s linear infinite;
  }

  @keyframes spinDice {
    to { transform: rotate(360deg); }
  }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
    background: #090c14;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 999px;
    padding: 0 14px;
    height: 38px;
    width: 225px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .search-box:focus-within {
    border-color: rgba(245, 158, 11, 0.55);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
    width: 275px;
  }

  .search-box svg {
    width: 14px;
    height: 14px;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: transform 0.25s ease, color 0.2s ease;
  }

  .search-box:focus-within svg {
    color: var(--accent);
    transform: scale(1.12);
  }

  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: var(--font-body);
    font-size: 13px;
    width: 100%;
    margin: 0 8px;
  }

  .search-box input::placeholder {
    color: var(--text-dim);
  }

  .search-clear {
    display: none;
    background: rgba(255, 255, 255, 0.12);
    border: none;
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    cursor: pointer;
    place-items: center;
    flex-shrink: 0;
  }

  .search-clear.visible {
    display: grid;
  }

  .search-kbd {
    font-size: 10.5px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-dim);
    pointer-events: none;
  }

  /* ---------- SIATKA 6 KAFELKÓW (3x2) ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    perspective: 1400px;
  }

  /* SATYNOWO-MATOWA KARTA GRY */
  .card {
    position: relative;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-top-color: var(--panel-rim);
    border-radius: var(--radius-xl);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 15px;
    gap: 15px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 
      0 20px 40px -15px rgba(0, 0, 0, 0.78),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transform-style: preserve-3d;
    transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.3s ease, background-color 0.25s ease;
    animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }

  @keyframes cardEntrance {
    from {
      opacity: 0;
      transform: translateY(28px) scale(0.96);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Wyróżnienie kafelka podczas animacji ruletki "Losuj grę" */
  .card.roulette-highlight {
    transform: translateY(-8px) scale(1.02) !important;
    border-color: var(--card-accent, #f59e0b) !important;
    box-shadow: 
      0 28px 56px -12px rgba(0, 0, 0, 0.9),
      0 0 36px var(--card-glow, rgba(245, 158, 11, 0.5)) !important;
  }

  /* Obrotowa świetlista obwódka przy hoverze */
  .card.ready::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: conic-gradient(
      from var(--border-angle),
      transparent 22%,
      rgba(255, 255, 255, 0.45) 45%,
      var(--card-accent, #f59e0b) 50%,
      rgba(255, 255, 255, 0.45) 55%,
      transparent 78%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 4;
  }

  .card.ready:hover::after,
  .card.roulette-highlight::after {
    opacity: 1;
    animation: spinBorder 3.2s linear infinite;
  }

  @keyframes spinBorder {
    to { --border-angle: 360deg; }
  }

  /* Satynowy połysk pod kursorem */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      360px circle at var(--mx, 50%) var(--my, 50%),
      rgba(255, 255, 255, 0.08),
      transparent 65%
    );
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 3;
  }

  .card:hover::before {
    opacity: 1;
  }

  .card.ready {
    cursor: pointer;
  }

  .card.ready:hover {
    background: var(--panel-hover);
    box-shadow: 
      0 28px 56px -14px rgba(0, 0, 0, 0.85),
      0 0 34px -10px var(--card-glow, rgba(245, 158, 11, 0.35));
  }

  .card.ready:active {
    transform: scale(0.98) !important;
  }

  /* Okładka */
  .cover-wrap {
    position: relative;
    border-radius: var(--radius-lg);
  }

  .cover {
    position: relative;
    z-index: 1;
    aspect-ratio: 16 / 10;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #0a0d15;
    border: 1px solid rgba(255, 255, 255, 0.09);
  }

  .cover .art {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card.ready:hover .cover .art,
  .card.roulette-highlight .cover .art {
    transform: scale(1.07);
  }

  .glass-sweep {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(
      115deg,
      transparent 25%,
      rgba(255, 255, 255, 0.22) 50%,
      transparent 75%
    );
    transform: translateX(-130%);
    pointer-events: none;
  }

  .card.ready:hover .glass-sweep {
    animation: sweepShine 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes sweepShine {
    0% { transform: translateX(-130%); }
    100% { transform: translateX(130%); }
  }

  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(6, 8, 14, 0.6) 0%, transparent 45%);
    pointer-events: none;
  }

  .cover-pill {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(9, 12, 20, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.14);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .card.ready:hover .cover-pill {
    transform: translateY(-2px) scale(1.03);
  }

  .cover-pill::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--card-accent, var(--accent));
    box-shadow: 0 0 8px var(--card-accent, var(--accent));
  }

  /* Treść karty */
  .card-body {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    padding: 0 2px;
  }

  .game-title {
    font-family: var(--font-heading);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: #fff;
    transition: color 0.2s ease;
  }

  .card.ready:hover .game-title {
    color: var(--accent-bright);
  }

  .game-desc {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: #cbd5e1;
    padding: 3px 9px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, border-color 0.2s ease;
    transition-delay: calc(var(--tag-i, 0) * 35ms);
  }

  .card.ready:hover .tag {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.16);
  }

  /* Przycisk Zagraj */
  .card-footer {
    position: relative;
    z-index: 2;
    margin-top: auto;
    padding-top: 4px;
  }

  .btn-play {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 43px;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .btn-play.ready {
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.12);
    cursor: pointer;
  }

  .btn-play.ready svg {
    width: 15px;
    height: 15px;
    color: var(--accent);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease;
  }

  .card.ready:hover .btn-play.ready,
  .card.roulette-highlight .btn-play.ready {
    background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%);
    color: #06080e;
    border-color: transparent;
    box-shadow: 0 10px 24px -4px rgba(245, 158, 11, 0.5);
  }

  .card.ready:hover .btn-play.ready svg,
  .card.roulette-highlight .btn-play.ready svg {
    color: #06080e;
    transform: translateX(4px) scale(1.1);
  }

  /* ---------- ZABLOKOWANE SLOTY (ZERO LEAKÓW - MATTE VAULT) ---------- */
  .card.locked-slot {
    background: rgba(12, 15, 23, 0.8);
    opacity: 0.88;
    cursor: not-allowed;
    user-select: none;
  }

  .card.locked-slot.shake {
    animation: lockedShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    border-color: rgba(239, 68, 68, 0.45);
  }

  @keyframes lockedShake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  .classified-blueprint {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: 
      radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.04), transparent 72%),
      repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.02),
        rgba(255, 255, 255, 0.02) 10px,
        transparent 10px,
        transparent 20px
      );
  }

  .classified-blueprint::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 45%;
    background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.08), transparent);
    animation: scanVertical 4.5s ease-in-out infinite;
  }

  @keyframes scanVertical {
    0%, 100% { transform: translateY(-100%); }
    50% { transform: translateY(240%); }
  }

  .lock-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(8, 11, 18, 0.76);
  }

  .lock-icon-box {
    position: relative;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--text-muted);
    transition: color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }

  .card.locked-slot:hover .lock-icon-box {
    color: var(--accent);
    border-color: rgba(245, 158, 11, 0.45);
    transform: scale(1.06);
  }

  .lock-icon-box::before {
    content: "";

/* ==========================================================================
   SYNTEZATOR DŹWIĘKÓW UI
   ========================================================================== */
const AudioFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  },
  play(type) {
    try {
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === 'hover') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(720, t);
        osc.frequency.exponentialRampToValueAtTime(920, t + 0.03);
        gain.gain.setValueAtTime(0.01, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
        osc.start(t);
        osc.stop(t + 0.035);
      } else if (type === 'tick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, t);
        gain.gain.setValueAtTime(0.02, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
        osc.start(t);
        osc.stop(t + 0.04);
      } else if (type === 'locked') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(88, t + 0.14);
        gain.gain.setValueAtTime(0.022, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        osc.start(t);
        osc.stop(t + 0.15);
      } else if (type === 'click') {
        osc.frequency.setValueAtTime(580, t);
        gain.gain.setValueAtTime(0.022, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
        osc.start(t);
        osc.stop(t + 0.05);
      } else if (type === 'launch') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, t);
        osc.frequency.exponentialRampToValueAtTime(820, t + 0.2);
        gain.gain.setValueAtTime(0.045, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
        osc.start(t);
        osc.stop(t + 0.24);
      }
    } catch (_) {}
  }
};

/* ==========================================================================
   FALA UDERZENIOWA PRZY KLIKNIĘCIU
   ========================================================================== */
function spawnShockwave(x, y, color = '#f59e0b') {
  const wave = document.createElement('div');
  wave.className = 'click-ripple';
  wave.style.left = `${x}px`;
  wave.style.top = `${y}px`;
  wave.style.setProperty('--ripple-color', color);
  document.body.appendChild(wave);
  setTimeout(() => wave.remove(), 700);
}

/* ==========================================================================
   ANIMOWANE TŁO GRAFICZNE: PŁYNĄCA SIATKA 3D + WSTĘGI + ISKRY
   ========================================================================== */
let targetColor = { r: 245, g: 158, b: 11 };
let currentColor = { r: 245, g: 158, b: 11 };

(function initGraphicTerrain() {
  const canvas = document.getElementById('terrainCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, time = 0, gridOffset = 0;
  let mouseNormX = 0;
  let sparks = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    mouseNormX = (e.clientX / w - 0.5) * 2;
  });
  resize();

  for (let i = 0; i < 28; i++) {
    sparks.push({
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 2 + 0.8,
      speedY: -(Math.random() * 0.45 + 0.15),
      drift: (Math.random() - 0.5) * 0.3,
      phase: Math.random() * Math.PI * 2
    });
  }

  function draw() {
    time += 0.014;
    gridOffset = (gridOffset + 0.016) % 1;

    currentColor.r += (targetColor.r - currentColor.r) * 0.06;
    currentColor.g += (targetColor.g - currentColor.g) * 0.06;
    currentColor.b += (targetColor.b - currentColor.b) * 0.06;

    const r = Math.round(currentColor.r);
    const g = Math.round(currentColor.g);
    const b = Math.round(currentColor.b);

    ctx.clearRect(0, 0, w, h);

    // 1. Płynące wstęgi fali świetlnej
    for (let wave = 0; wave < 3; wave++) {
      ctx.beginPath();
      const baseY = h * (0.27 + wave * 0.09);
      const amp = 32 + wave * 14;
      const freq = 0.0022 - wave * 0.0003;
      const phase = time * (0.85 + wave * 0.25) + wave * 1.4;

      for (let x = 0; x <= w; x += 18) {
        const y = baseY + Math.sin(x * freq + phase) * amp + Math.cos(x * freq * 0.5 - phase) * (amp * 0.45);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.12 - wave * 0.025})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // 2. Nieskończenie płynąca siatka 3D na dole ekranu
    const horizonY = h * 0.68;
    const gridHeight = h - horizonY;
    const rows = 13;
    const cols = 18;
    const vanishX = w * 0.5 - mouseNormX * 65;

    const horizonGrad = ctx.createLinearGradient(0, horizonY, w, horizonY);
    horizonGrad.addColorStop(0, 'transparent');
    horizonGrad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.28)`);
    horizonGrad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    ctx.lineTo(w, horizonY);
    ctx.strokeStyle = horizonGrad;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    for (let i = 0; i < rows; i++) {
      const t = (i + gridOffset) / rows;
      const progress = Math.pow(t, 2.1);
      const y = horizonY + progress * gridHeight;
      const alpha = progress * 0.16;

      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    for (let c = -cols; c <= cols; c++) {
      const spreadBottom = c * (w / 8.5) - mouseNormX * 140;
      const spreadTop = c * (w / 38);

      ctx.beginPath();
      ctx.moveTo(vanishX + spreadTop, horizonY);
      ctx.lineTo(vanishX + spreadBottom, h);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.08)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 3. Unoszące się iskry energii
    for (const s of sparks) {
      s.y += s.speedY;
      s.x += s.drift + Math.sin(time + s.phase) * 0.15;
      if (s.y < -10) {
        s.y = h + 10;
        s.x = Math.random() * w;
      }
      const alpha = 0.15 + Math.sin(time * 2 + s.phase) * 0.1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${Math.max(0.04, alpha)})`;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  draw();
})();

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function updateStatus() {
  const readyCount = GAMES.filter(g => g.status === 'ready').length;
  const totalCount = GAMES.length;
  const statusEl = document.getElementById('headerLiveStatus');
  if (statusEl) statusEl.textContent = `${readyCount} / ${totalCount} Odblokowane`;
}

function attachCardInteractions(card, game) {
  card.addEventListener('mouseenter', () => {
    AudioFX.play('hover');
    if (game && game.rgb) {
      targetColor = game.rgb;
      document.documentElement.style.setProperty('--dynamic-rgb', `${game.rgb.r}, ${game.rgb.g}, ${game.rgb.b}`);
    }
  });

  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateX = ((y - centerY) / centerY) * -4.5;
    const rotateY = ((x - centerX) / centerX) * 4.5;

    card.style.setProperty('--mx', `${x}px`);
    card.style.setProperty('--my', `${y}px`);
    card.style.transform = `translateY(-7px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
  });

  card.addEventListener('mouseleave', () => {
    card.style.transform = '';
    targetColor = DEFAULT_RGB;
    document.documentElement.style.setProperty('--dynamic-rgb', '245, 158, 11');
  });
}

function renderGames() {
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';

  const q = currentQuery.trim().toLowerCase();
  const filtered = GAMES.filter(game => {
    if (game.status !== 'ready') return !q;
    return !q || (
      game.title.toLowerCase().includes(q) ||
      (game.tags || []).some(t => t.toLowerCase().includes(q)) ||
      (game.desc || '').toLowerCase().includes(q)
    );
  });

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state">
        ${ICONS.empty}
        <h3>Brak wyników</h3>
        <p>Nie znaleziono odblokowanej gry pasującej do zapytania.</p>
      </div>`;
    return;
  }

  filtered.forEach((game, index) => {
    const ready = game.status === 'ready';
    const card = document.createElement('div');
    card.className = `card ${ready ? 'ready' : 'locked-slot'}`;
    card.style.animationDelay = `${index * 65}ms`;

    if (ready) {
      card.dataset.gameUrl = game.url;
      card.dataset.gameTitle = game.title;
      if (game.accent) card.style.setProperty('--card-accent', game.accent);
      if (game.glow) card.style.setProperty('--card-glow', game.glow);

      card.innerHTML = `
        <div class="cover-wrap">
          <div class="cover">
            <img class="art" src="${esc(game.image)}" alt="${esc(game.title)}" loading="lazy">
            <div class="glass-sweep"></div>
            <span class="cover-pill">${esc(game.players)}</span>
          </div>
        </div>

        <div class="card-body">
          <h2 class="game-title">${esc(game.title)}</h2>
          <p class="game-desc">${esc(game.desc)}</p>
          <div class="tags">
            ${(game.tags || []).map((t, ti) => `<span class="tag" style="--tag-i:${ti}">${esc(t)}</span>`).join('')}
          </div>
        </div>

        <div class="card-footer">
          <button type="button" class="btn-play ready">
            ${ICONS.play} Zagraj teraz
          </button>
        </div>
      `;

      attachCardInteractions(card, game);

      card.addEventListener('click', e => {
        if (window.getSelection().toString()) return;
        spawnShockwave(e.clientX, e.clientY, game.accent || '#f59e0b');
        launchGame(game.url, game.title);
      });
    } else {
      const defaultLabel = `${game.slotCode} // TAJNE`;
      card.innerHTML = `
        <div class="cover-wrap">
          <div class="cover">
            <div class="classified-blueprint"></div>
            <div class="lock-overlay">
              <div class="lock-icon-box">${ICONS.lock}</div>
              <p>${esc(defaultLabel)}</p>
            </div>
          </div>
        </div>

        <div class="redacted-body" aria-hidden="true">
          <div class="redacted-line title"></div>
          <div class="redacted-line desc-1"></div>
          <div class="redacted-line desc-2"></div>
          <div class="redacted-tags">
            <div class="redacted-pill"></div>
            <div class="redacted-pill"></div>
          </div>
        </div>

        <div class="card-footer">
          <button type="button" class="btn-play wip" disabled>
            ${ICONS.lock} Zablokowane
          </button>
        </div>
      `;

      const labelEl = card.querySelector('.lock-overlay p');

      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mx', `${e.clientX - rect.left}px`);
        card.style.setProperty('--my', `${e.clientY - rect.top}px`);
      });

      card.addEventListener('click', () => {
        AudioFX.play('locked');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        labelEl.textContent = 'ODMOWA DOSTĘPU';
        clearTimeout(card._resetTimer);
        card._resetTimer = setTimeout(() => {
          labelEl.textContent = defaultLabel;
        }, 900);
      });
    }

    grid.appendChild(card);
  });

  updateStatus();
}

/* ==========================================================================
   KONTROLA EKRANU GRY + ANIMACJA RULETKI PRZY LOSOWANIU
   ========================================================================== */
let activeGameUrl = '';
let isRolling = false;

function launchGame(url, title) {
  AudioFX.play('launch');
  const hub = document.getElementById('hubView');
  hub.classList.add('launching');

  setTimeout(() => {
    if (url.startsWith('http://') || url.startsWith('https://')) {
      window.location.href = url;
      return;
    }
    activeGameUrl = url;
    const frame = document.getElementById('gameFrame');
    const bustUrl = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
    frame.src = bustUrl;
    const hud = document.getElementById('stageHud');
    if (hud) hud.title = `${title || 'Gra'} • ESC aby wyjść`;
    document.getElementById('stage').classList.add('open');
    frame.focus();
  }, 240);
}

function launchRandomGame() {
  if (isRolling) return;
  const readyCards = Array.from(document.querySelectorAll('.card.ready'));
  if (!readyCards.length) return;

  isRolling = true;
  const btn = document.getElementById('btnRandom');
  btn.classList.add('rolling');

  const steps = 8 + Math.floor(Math.random() * 4);
  let currentStep = 0;
  let lastIndex = -1;

  function stepRoulette() {
    readyCards.forEach(c => c.classList.remove('roulette-highlight'));

    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * readyCards.length);
    } while (readyCards.length > 1 && nextIndex === lastIndex);
    lastIndex = nextIndex;

    const pickedCard = readyCards[nextIndex];
    pickedCard.classList.add('roulette-highlight');
    AudioFX.play('tick');

    currentStep++;
    if (currentStep < steps) {
      setTimeout(stepRoulette, 90 + currentStep * 22);
    } else {
      setTimeout(() => {
        const rect = pickedCard.getBoundingClientRect();
        spawnShockwave(rect.left + rect.width / 2, rect.top + rect.height / 2, '#f59e0b');
        pickedCard.classList.remove('roulette-highlight');
        btn.classList.remove('rolling');
        isRolling = false;
        launchGame(pickedCard.dataset.gameUrl, pickedCard.dataset.gameTitle);
      }, 360);
    }
  }

  stepRoulette();
}

function reloadGameFrame() {
  AudioFX.play('click');
  const frame = document.getElementById('gameFrame');
  if (activeGameUrl) {
    const bustUrl = activeGameUrl + (activeGameUrl.includes('?') ? '&' : '?') + 'v=' + Date.now();
    frame.src = bustUrl;
  }
}

function toggleFullscreen() {
  AudioFX.play('click');
  const elem = document.documentElement;
  if (!document.fullscreenElement) {
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

function closeGame() {
  AudioFX.play('click');
  const frame = document.getElementById('gameFrame');
  frame.src = 'about:blank';
  document.getElementById('stage').classList.remove('open');
  document.getElementById('hubView').classList.remove('launching');
  activeGameUrl = '';
}

/* ==========================================================================
   WYSZUKIWANIE I SKRÓTY KLAWISZOWE
   ========================================================================== */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchKbd = document.getElementById('searchKbd');

searchInput.addEventListener('input', e => {
  currentQuery = e.target.value;
  const hasValue = currentQuery.length > 0;
  searchClear.classList.toggle('visible', hasValue);
  searchKbd.style.display = hasValue ? 'none' : '';
  renderGames();
});

searchClear.addEventListener('click', e => {
  e.preventDefault();
  AudioFX.play('click');
  searchInput.value = '';
  currentQuery = '';
  searchClear.classList.remove('visible');
  searchKbd.style.display = '';
  renderGames();
  searchInput.focus();
});

window.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
    return;
  }
  if (e.key === 'Escape' && document.getElementById('stage').classList.contains('open')) {
    closeGame();
  }
});

/* Start */
renderGames();
</script>
