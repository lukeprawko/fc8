<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Chaos Tanks Online</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #111; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    #ui-container { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 20px; align-items: flex-start; }
    .panel { background: rgba(0,0,0,0.85); border: 2px solid #444; border-radius: 8px; padding: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    h2 { font-size: 16px; margin-bottom: 8px; color: #00ffcc; text-transform: uppercase; }
    input, button { padding: 8px 12px; margin: 4px 0; border: 1px solid #555; background: #222; color: #fff; border-radius: 4px; font-weight: bold; }
    button { cursor: pointer; background: #0088cc; border: none; transition: 0.2s; }
    button:hover { background: #00aaff; }
    .upgrade-btn { background: #28a745; width: 100%; margin-top: 5px; }
    .upgrade-btn:hover { background: #34ce57; }
    #stats-panel { min-width: 200px; }
    #net-panel { min-width: 250px; }
    canvas { display: block; background: #1a1a1a; cursor: crosshair; }
    #chat-box { position: absolute; bottom: 10px; left: 10px; width: 300px; height: 120px; background: rgba(0,0,0,0.6); pointer-events: none; padding: 10px; overflow-y: auto; font-size: 12px; font-family: monospace; }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="panel" id="net-panel">
      <h2>Multiplayer (WebRTC)</h2>
      <div id="my-id-display">Twój ID: <b style="color:#00ffcc;">Łączenie...</b></div>
      <hr style="border-color:#444; margin:8px 0;">
      <input type="text" id="join-id" placeholder="Wklej ID Hosta...">
      <button id="btn-join">Dołącz do gry</button>
      <div id="status-text" style="font-size:12px; color:#aaa; margin-top:5px;">Połączono jako Host. Przekaż swoje ID znajomemu!</div>
    </div>

    <div class="panel" id="stats-panel">
      <h2>Czołg (Poziom <span id="lvl-val">1</span>)</h2>
      <div>XP: <span id="xp-val">0</span> / <span id="max-xp-val">100</span></div>
      <div>Punkty Ulepszeń: <b id="pts-val" style="color:#ffcc00;">0</b></div>
      <button class="upgrade-btn" onclick="upgrade('speed')">+ Prędkość Ruchu</button>
      <button class="upgrade-btn" onclick="upgrade('reload')">+ Szybciej Strzelaj</button>
      <button class="upgrade-btn" onclick="upgrade('damage')">+ Obrażenia Pocisków</button>
      <button class="upgrade-btn" onclick="upgrade('hp')">+ Max HP</button>
    </div>
  </div>

  <div id="chat-box"></div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // --- Świat Gry ---
    const WORLD_SIZE = 3000;
    const keys = {};
    const mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };
    
    // PeerJS Networking
    let peer = new Peer();
    let myId = "";
    let connections = [];
    let isHost = true;

    // Lokalne Dane Gracza
    let player = {
      id: null,
      x: 500, y: 500, size: 30, angle: 0,
      speed: 4, hp: 100, maxHp: 100,
      lvl: 1, xp: 0, maxXp: 100, upgradePts: 0,
      reloadTime: 250, lastShot: 0, damage: 20,
      color: '#' + Math.floor(Math.random()*16777215).toString(16),
      stats: { speedLvl: 0, reloadLvl: 0, dmgLvl: 0, hpLvl: 0 }
    };

    let otherPlayers = {};
    let bullets = [];
    let powerups = [];
    let obstacles = [];
    let blackHoles = [];

    // Generowanie Mapy Przeszkód
    function initMap() {
      obstacles = [];
      for (let i = 0; i < 80; i++) {
        obstacles.push({
          x: Math.random() * (WORLD_SIZE - 200) + 100,
          y: Math.random() * (WORLD_SIZE - 200) + 100,
          w: 80 + Math.random() * 100,
          h: 80 + Math.random() * 100,
          type: Math.random() > 0.3 ? 'wall' : 'crystal' // Crystal daje XP
        });
      }
    }
    initMap();

    // --- Obsługa PeerJS ---
    peer.on('open', (id) => {
      myId = id;
      player.id = id;
      document.getElementById('my-id-display').innerHTML = `Twój ID: <b style="color:#00ffcc;">${id}</b>`;
    });

    peer.on('connection', (conn) => {
      setupConnection(conn);
    });

    document.getElementById('btn-join').addEventListener('click', () => {
      const targetId = document.getElementById('join-id').value.trim();
      if (targetId) {
        isHost = false;
        document.getElementById('status-text').innerText = "Łączenie z hostem...";
        const conn = peer.connect(targetId);
        setupConnection(conn);
      }
    });

    function setupConnection(conn) {
      connections.push(conn);
      conn.on('open', () => {
        document.getElementById('status-text').innerText = "Połączono Pomyślnie!";
      });

      conn.on('data', (data) => {
        handleNetworkData(data);
      });

      conn.on('close', () => {
        delete otherPlayers[conn.peer];
      });
    }

    function broadcast(data) {
      connections.forEach(c => {
        if (c.open) c.send(data);
      });
    }

    function handleNetworkData(data) {
      if (data.type === 'sync_player') {
        otherPlayers[data.player.id] = data.player;
      } else if (data.type === 'spawn_bullet') {
        bullets.push(data.bullet);
      } else if (data.type === 'spawn_powerup') {
        powerups.push(data.powerup);
      } else if (data.type === 'spawn_blackhole') {
        blackHoles.push(data.blackhole);
      }
    }

    // --- Sterowanie i Input ---
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('mousedown', e => {
      if (e.button === 0) shoot();
    });

    function shoot() {
      const now = Date.now();
      if (now - player.lastShot < player.reloadTime) return;
      player.lastShot = now;

      const bullet = {
        id: Math.random(),
        ownerId: player.id,
        x: player.x + Math.cos(player.angle) * 40,
        y: player.y + Math.sin(player.angle) * 40,
        vx: Math.cos(player.angle) * 12,
        vy: Math.sin(player.angle) * 12,
        damage: player.damage,
        life: 180
      };

      bullets.push(bullet);
      broadcast({ type: 'spawn_bullet', bullet });
    }

    // --- Mechanika Gry & Fizyka ---
    function update() {
      // Ruch Gracza
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

      let newX = player.x + dx * player.speed;
      let newY = player.y + dy * player.speed;

      // Kolizje z Przeszkodami
      if (!checkObstacleCollision(newX, player.y, player.size)) player.x = Math.max(player.size, Math.min(WORLD_SIZE - player.size, newX));
      if (!checkObstacleCollision(player.x, newY, player.size)) player.y = Math.max(player.size, Math.min(WORLD_SIZE - player.size, newY));

      // Celowanie myszką (Kąt)
      const screenCenterX = canvas.width / 2;
      const screenCenterY = canvas.height / 2;
      player.angle = Math.atan2(mouse.y - screenCenterY, mouse.x - screenCenterX);

      // Aktualizacja Pocisków
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Wciąganie pocisków przez Czarne Dziury
        blackHoles.forEach(bh => {
          let dist = Math.hypot(bh.x - b.x, bh.y - b.y);
          if (dist < bh.radius) {
            b.vx += (bh.x - b.x) * 0.05;
            b.vy += (bh.y - b.y) * 0.05;
          }
        });

        // Trafienie lokalnego gracza z wrogiego pocisku
        if (b.ownerId !== player.id) {
          let dist = Math.hypot(player.x - b.x, player.y - b.y);
          if (dist < player.size) {
            player.hp -= b.damage;
            bullets.splice(i, 1);
            if (player.hp <= 0) respawn();
            continue;
          }
        }

        if (b.life <= 0 || checkObstacleCollision(b.x, b.y, 4)) {
          bullets.splice(i, 1);
        }
      }

      // Generowanie Powerupów i Czarnych Dziur (Host)
      if (isHost) {
        if (Math.random() < 0.005 && powerups.length < 10) {
          let p = { id: Math.random(), x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, type: ['blackhole', 'heal', 'xp'][Math.floor(Math.random()*3)] };
          powerups.push(p);
          broadcast({ type: 'spawn_powerup', powerup: p });
        }
      }

      // Podnoszenie Powerupów
      for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        if (Math.hypot(player.x - p.x, player.y - p.y) < player.size + 15) {
          if (p.type === 'heal') player.hp = Math.min(player.maxHp, player.hp + 40);
          if (p.type === 'xp') addXP(50);
          if (p.type === 'blackhole') {
            let bh = { x: player.x + Math.cos(player.angle)*150, y: player.y + Math.sin(player.angle)*150, radius: 300, life: 300 };
            blackHoles.push(bh);
            broadcast({ type: 'spawn_blackhole', blackhole: bh });
          }
          powerups.splice(i, 1);
        }
      }

      // Aktualizacja Czarnych Dziur
      for (let i = blackHoles.length - 1; i >= 0; i--) {
        let bh = blackHoles[i];
        bh.life--;
        let dist = Math.hypot(bh.x - player.x, bh.y - player.y);
        if (dist < bh.radius) {
          player.x += (bh.x - player.x) * 0.02;
          player.y += (bh.y - player.y) * 0.02;
        }
        if (bh.life <= 0) blackHoles.splice(i, 1);
      }

      // Wysyłanie współrzędnych gracza do sieci
      broadcast({ type: 'sync_player', player: player });

      // Odświeżenie UI Stats
      document.getElementById('lvl-val').innerText = player.lvl;
      document.getElementById('xp-val').innerText = Math.floor(player.xp);
      document.getElementById('max-xp-val').innerText = player.maxXp;
      document.getElementById('pts-val').innerText = player.upgradePts;
    }

    function checkObstacleCollision(x, y, radius) {
      return obstacles.some(o => x + radius > o.x && x - radius < o.x + o.w && y + radius > o.y && y - radius < o.y + o.h);
    }

    function addXP(amount) {
      player.xp += amount;
      if (player.xp >= player.maxXp) {
        player.xp -= player.maxXp;
        player.lvl++;
        player.upgradePts++;
        player.maxXp = Math.floor(player.maxXp * 1.5);
      }
    }

    function upgrade(stat) {
      if (player.upgradePts <= 0) return;
      if (stat === 'speed') { player.speed += 0.8; player.stats.speedLvl++; }
      if (stat === 'reload') { player.reloadTime = Math.max(80, player.reloadTime - 35); player.stats.reloadLvl++; }
      if (stat === 'damage') { player.damage += 10; player.stats.dmgLvl++; }
      if (stat === 'hp') { player.maxHp += 25; player.hp += 25; player.stats.hpLvl++; }
      player.upgradePts--;
    }

    function respawn() {
      player.hp = player.maxHp;
      player.x = Math.random() * WORLD_SIZE;
      player.y = Math.random() * WORLD_SIZE;
    }

    // --- Renderowanie (Rysowanie Gry) ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Kamera śledząca gracza
      ctx.save();
      ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

      // Rysowanie Tła (Kratka)
      ctx.strokeStyle = '#252525';
      ctx.lineWidth = 2;
      for (let x = 0; x < WORLD_SIZE; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
      }
      for (let y = 0; y < WORLD_SIZE; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
      }

      // Rysowanie Przeszkód
      obstacles.forEach(o => {
        ctx.fillStyle = o.type === 'wall' ? '#444' : '#00bfff';
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#666';
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      });

      // Czarnych Dziur
      blackHoles.forEach(bh => {
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius * (bh.life/300), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(138, 43, 226, 0.2)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
      });

      // Powerupy
      powerups.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = p.type === 'heal' ? '#00ff00' : p.type === 'xp' ? '#ffcc00' : '#8a2be2';
        ctx.fill();
      });

      // Pociski
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3300';
        ctx.fill();
      });

      // Rysowanie Innych Graczy
      Object.values(otherPlayers).forEach(p => drawTank(p));

      // Rysowanie Lokalnego Gracza
      drawTank(player);

      ctx.restore();
    }

    function drawTank(t) {
      ctx.save();
      ctx.translate(t.x, t.y);

      // Pasek HP nad czołgiem
      ctx.fillStyle = 'red';
      ctx.fillRect(-25, -t.size - 15, 50, 6);
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(-25, -t.size - 15, (t.hp / t.maxHp) * 50, 6);

      // Lufa
      ctx.rotate(t.angle);
      ctx.fillStyle = '#888';
      ctx.fillRect(0, -6, t.size + 15, 12);

      // Kadłub Czołgu
      ctx.beginPath();
      ctx.arc(0, 0, t.size, 0, Math.PI * 2);
      ctx.fillStyle = t.color || '#00ffcc';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      ctx.restore();
    }

    // Główna pętla gry
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    // RWD Canvas
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
