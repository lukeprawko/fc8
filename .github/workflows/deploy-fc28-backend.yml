name: Deploy FC28 Backend (Cloudflare Worker + Durable Objects + D1)

on:
  push:
    branches: [ main ]
    paths:
      - 'games/fc28/server/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-fc28-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalacja zależności pakietu współdzielonego
        run: |
          npm --prefix packages/shared ci
          npm --prefix packages/shared run build

      - name: Instalacja zależności serwera
        run: |
          npm --prefix games/fc28/server ci

      - name: Weryfikacja typów TypeScript
        run: |
          npm --prefix games/fc28/server run build

      - name: Aplikacja migracji bazy D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'games/fc28/server'
          command: 'd1 execute fc28-db --remote --file=./schema.sql'

      - name: Wdrożenie Cloudflare Worker & Durable Objects
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'games/fc28/server'
          command: 'deploy'
