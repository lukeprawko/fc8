name: Deploy FC28 Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'games/fc28/client/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-fc28-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Budowa pakietu współdzielonego
        run: |
          npm --prefix packages/shared ci
          npm --prefix packages/shared run build

      - name: Budowa frontendu gry (Vite + Obfuskacja)
        run: |
          npm --prefix games/fc28/client ci
          npm --prefix games/fc28/client run build

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v4

      - name: Wysłanie artefaktu strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'games/fc28/client/dist'

      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
